            <div class="section-label">${app.name} · 事件规则</div><section class="settings-group tts-event-group">${appEvents.map(event => renderTTSEventRow(event, app)).join('')}</section>
            <div class="section-label" style="margin-top:30px">${app.name} · 播放设置</div><section class="settings-group">
              <div class="settings-row"><div><div class="row-title">${app.name} 事件提示音</div><div class="row-caption">只覆盖当前来源；缺失事件开关继承全局默认</div></div><div class="row-control"><button class="toggle blue on" type="button" data-toggle="${app.name} 事件提示音" aria-pressed="true"></button></div></div>
              <div class="settings-row"><div><div class="row-title">主音量（全局）</div><div class="row-caption">所有来源共用唯一主音量轴</div></div><div class="row-control"><input class="native-range" type="range" min="0" max="100" value="68" data-range="主音量"><span class="range-value" data-range-value="主音量">68%</span></div></div>
              <div class="settings-row"><div><div class="row-title">声音包</div><div class="row-caption">当前使用「我的提示音」· 用户声音包，源自内置 Paimon 副本</div></div><div class="row-control"><button class="plain-button" type="button" data-action="sound-packs">管理</button></div></div>
            </section>
            <div class="info-callout"><span class="info-icon">i</span><span>声音描述只用于所选事件的本次生成；采用时只保存提示音名称和最终音频。候选采用成功前保留旧声音，未采用候选在关闭或重新生成时清理。</span></div>
          </section>
        </div>${renderTTSCredentialModal()}`;
    }

    pages.events = () => {
      const app = appById(selectedApp);
      const appEvents = eventsForApp(app.id);
      if (isTTSPrototype && app.id === 'workbuddy') return renderTTSPage(app, appEvents);
      return `<header class="page-header"><div><h1>事件与提示音</h1><p>按 app 单独管理事件映射、启用状态和声音选择；当前配置不会影响其他 app。</p></div><div class="page-header-actions"><span class="demo-label">演示数据</span><button class="plain-button" type="button" data-action="play-all">试听全部</button></div></header>
        <div class="event-layout">
          <aside class="event-app-nav" aria-label="选择管理对象">
            <div class="event-app-nav-head"><div><div class="scope-eyebrow">管理对象</div><div class="event-app-nav-title">集成</div></div><span class="event-app-count">${apps.length} 个已接入</span></div>
            <div class="event-app-picker" role="listbox" aria-label="集成列表">${apps.map(item => `<button class="event-app-option ${item.id === app.id ? 'active' : ''}" type="button" role="option" aria-selected="${item.id === app.id ? 'true' : 'false'}" data-event-app="${item.id}"><span class="event-app-option-head"><span class="app-name">${item.name}</span><span class="app-coverage">${item.coverage}</span></span><span class="event-app-option-foot">${appStatus(item)}<span class="app-coverage">查看事件</span></span></button>`).join('')}</div>
            <div class="event-app-nav-foot">列表纵向滚动；即使接入 10+ 个 app，也保持同一套独立事件管理方式。</div>
          </aside>
          <section class="event-detail">
            <div class="event-detail-header"><div><div class="scope-eyebrow">当前管理对象</div><div class="event-detail-title">${app.name}</div><div class="event-detail-subtitle">${app.mechanism}</div></div>${appStatus(app)}</div>
            <div class="section-label">${app.name} · 事件规则</div><section class="settings-group">${appEvents.map(event => `<div class="event-row scoped"><span class="event-symbol ${event.tone}">${event.symbol}</span><span><span class="event-name">${event.name}</span><span class="event-code">${event.code}</span></span><span class="event-coverage">${status(event.availability, event.coverage)}</span><button class="toggle event-toggle ${event.enabled ? 'on' : ''}" type="button" data-event-toggle="${event.id}" data-event-app-id="${app.id}" aria-pressed="${event.enabled ? 'true' : 'false'}" aria-label="${event.enabled ? '关闭' : '开启'} ${event.name}" ${event.availability === 'ready' ? '' : 'disabled'}></button><span class="event-sound"><button class="plain-button" type="button" data-action="play" data-event="${event.id}" data-app-id="${app.id}" ${event.availability === 'ready' && event.sound !== '未设置' ? '' : 'disabled'}>${event.sound}</button></span></div>`).join('')}</section>
            <div class="section-label" style="margin-top:30px">${app.name} · 播放设置</div><section class="settings-group">
              <div class="settings-row"><div><div class="row-title">${app.name} 事件提示音</div><div class="row-caption">只覆盖当前来源；缺失事件开关继承全局默认</div></div><div class="row-control"><button class="toggle blue on" type="button" data-toggle="${app.name} 事件提示音" aria-pressed="true"></button></div></div>
              <div class="settings-row"><div><div class="row-title">主音量（全局）</div><div class="row-caption">所有来源共用唯一主音量轴</div></div><div class="row-control"><input class="native-range" type="range" min="0" max="100" value="68" data-range="主音量"><span class="range-value" data-range-value="主音量">68%</span></div></div>
              <div class="settings-row"><div><div class="row-title">声音包</div><div class="row-caption">当前使用 Paimon · 当前来源缺失覆盖时继承全局默认</div></div><div class="row-control"><button class="plain-button" type="button" data-action="sound-packs">管理</button></div></div>
            </section>
            <div class="info-callout"><span class="info-icon">i</span><span>切换左侧 app 后，右侧的事件列表、开关、覆盖状态和提示音都会切换到该 app 的独立配置；不会写入其他 app。</span></div>
          </section>
        </div>`;
    };

    pages.notifications = () => `<header class="page-header"><div><h1>通知</h1><p>控制 Claudio 在不同宿主状态下如何提醒你。</p></div></header>
      <div class="section-label">通知行为</div><section class="settings-group">
        <div class="settings-row"><div><div class="row-title">任务开始时通知</div><div class="row-caption">仅播放声音，不显示系统横幅</div></div><div class="row-control"><button class="toggle blue on" type="button" data-toggle="任务开始时通知" aria-pressed="true"></button></div></div>
        <div class="settings-row"><div><div class="row-title">响应结束时通知</div><div class="row-caption">宿主完成一轮响应后提示</div></div><div class="row-control"><button class="toggle blue on" type="button" data-toggle="响应结束时通知" aria-pressed="true"></button></div></div>
        <div class="settings-row tall"><div><div class="row-title">等待输入时通知</div><div class="row-caption">仅对官方提供的 Notification 或 PermissionRequest 子集生效</div></div><div class="row-control"><button class="toggle" type="button" data-toggle="等待输入时通知" aria-pressed="false"></button></div></div>
      </section>
      <div class="section-label" style="margin-top:34px">静默</div><section class="settings-group">
        <div class="settings-row"><div class="row-title">专注模式中静音</div><div class="row-control"><button class="toggle blue on" type="button" data-toggle="专注模式中静音" aria-pressed="true"></button></div></div>
        <div class="settings-row"><div class="row-title">会议期间静音</div><div class="row-control"><button class="toggle" type="button" data-toggle="会议期间静音" aria-pressed="false"></button></div></div>
      </section>`;

    pages.display = () => `<header class="page-header"><div><h1>显示</h1><p>控制 Claudio 面板和菜单栏图标的外观。</p></div></header><div class="section-label">面板</div><section class="settings-group"><div class="settings-row"><div class="row-title">面板宽度</div><div class="row-control"><select class="native-select"><option>跟随内容</option><option>紧凑</option><option>宽松</option></select></div></div><div class="settings-row"><div class="row-title">菜单栏显示状态点</div><div class="row-control"><button class="toggle blue on" type="button" data-toggle="菜单栏显示状态点" aria-pressed="true"></button></div></div></section>`;
    pages.sounds = () => `<header class="page-header"><div><h1>声音</h1><p>管理声音包、试听和每个语义事件的默认声音。</p></div><div class="page-header-actions"><button class="blue-button" type="button" data-action="import">导入声音包</button></div></header><div class="section-label">声音包</div><section class="settings-group"><div class="settings-row tall"><div><div class="row-title">Paimon</div><div class="row-caption">内置 · 5 个事件 · 当前使用</div></div><div class="row-control"><button class="plain-button" type="button" data-action="preview-pack">试听</button><span class="status ready"><span class="status-dot"></span>当前</span></div></div><div class="settings-row tall"><div><div class="row-title">Minimal</div><div class="row-caption">内置 · 简短而低干扰</div></div><div class="row-control"><button class="plain-button" type="button" data-action="preview-pack">试听</button><button class="plain-button" type="button" data-action="select-pack">使用</button></div></div></section>`;
    pages.usage = () => `<header class="page-header"><div><h1>用量</h1><p>只统计本地收到的事件和提示音播放，不上传宿主内容。</p></div></header><div class="mini-stat-grid"><div class="mini-stat"><strong>128</strong><span>本周事件</span></div><div class="mini-stat"><strong>96</strong><span>已播放提示音</span></div><div class="mini-stat"><strong>0 B</strong><span>网络上传</span></div></div><div class="section-label" style="margin-top:30px">数据范围</div><section class="settings-group"><div class="settings-row tall"><div><div class="row-title">本地诊断日志</div><div class="row-caption">只保留事件标识、时间和脱敏播放结果，不保存提示词或响应正文。</div></div><div class="row-control"><button class="plain-button" type="button" data-action="logs">打开日志</button></div></div></section>`;

    ['shortcuts', 'about'].forEach(page => {
      const names = { shortcuts: ['快捷键', '为 Claudio 面板、试听和静音操作设置全局键盘快捷键。'], about: ['关于 Claudio', 'AI app 事件提示音中心 · 原生 macOS 风格原型。'] };
      pages[page] = () => `<div class="empty-page"><h2>${names[page][0]}</h2><p>${names[page][1]}</p><div class="info-callout"><span class="info-icon">i</span><span>这个页面属于新原生 UI 的导航骨架，后续接入真实数据模型时保留同样的设置行结构。</span></div></div>`;
    });

    function setPage(page) {
      activePage = pages[page] ? page : 'apps';
      try { const url = new URL(window.location.href); url.searchParams.set('page', activePage); url.searchParams.set('app', selectedApp); window.history.replaceState({}, '', url); } catch (_) {}
      document.querySelector('#page-root').innerHTML = pages[activePage]();
      document.querySelectorAll('[data-page]').forEach(button => button.classList.toggle('active', button.dataset.page === activePage));
      if (isTTSPrototype && activePage === 'events' && selectedApp === 'workbuddy') syncTTSURL();
    }
    function showToast(message) {
      const toast = document.querySelector('#toast');
      toast.textContent = message;
      toast.classList.add('visible');
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove('visible'), 2200);
    }

    function rerenderTTS() {
      if (!isTTSPrototype) return;
      setPage('events');
    }

    function setTTSStage(stage) {
      window.clearTimeout(ttsTransitionTimer);
      ttsState.stage = stage;
      if (stage !== 'candidates') ttsState.playing = null;
      rerenderTTS();
    }

    function resetTTSFlow() {
      window.clearTimeout(ttsTransitionTimer);
      const eventId = ttsState.eventId;
      const prompt = ttsState.prompt;
      const cueName = ttsState.cueName;
      const cueNameIsManual = ttsState.cueNameIsManual;
      ttsState = makeTTSState('prompt', eventId);
      ttsState.prompt = prompt;
      ttsState.cueName = cueName;
      ttsState.cueNameIsManual = cueNameIsManual;
      rerenderTTS();
    }

    function openTTSEvent(eventId) {
      const item = eventById('workbuddy', eventId);
      if (!item || item.availability !== 'ready') return;
      if (ttsState.eventId !== eventId) {
        ttsState = makeTTSState('prompt', eventId);
      }
      ttsState.inlineOpen = true;
      rerenderTTS();
    }

    function beginTTSGeneration() {
      const prompt = ttsState.prompt.trim();
      if (!prompt) {
        ttsState.promptError = '请描述想听到的声音。';
        setTTSStage('prompt');
        return;
      }
      if (!ttsCredentialState.ready) {
        ttsState.promptError = '请先配置 API Key；你的声音描述会保留。';
        ttsCredentialState.modalOpen = true;
        ttsCredentialState.confirmDelete = false;
        rerenderTTS();
        return;
      }
      window.clearTimeout(ttsTransitionTimer);
      ttsState.prompt = prompt;
      ttsState.promptError = '';
      ttsState.nameError = '';
      ttsState.confirmedSoundPlan = null;
      ttsState.playing = null;
      ttsState.stage = 'interpreting';
      rerenderTTS();
      ttsTransitionTimer = window.setTimeout(() => {
        if (ttsState.stage !== 'interpreting') return;
        const interpretedPlan = interpretTTSPrompt(prompt);
        ttsState.soundPlan = normalizeTTSSoundPlan(interpretedPlan, prompt);
        if (!ttsState.cueNameIsManual || !ttsState.cueName.trim()) {
          ttsState.cueName = suggestedTTSCueName(prompt, ttsState.soundPlan);
          ttsState.cueNameIsManual = false;
        }
        ttsState.confirmedSoundPlan = { ...ttsState.soundPlan };
        setTTSStage('generating');
        ttsTransitionTimer = window.setTimeout(() => {
          if (ttsState.stage === 'generating') setTTSStage('candidates');
        }, 850);
      }, 360);
    }

    function handleTTSAction(target) {
      const action = target.dataset.ttsAction;
      if (action === 'reset') return resetTTSFlow();
      if (action === 'open-event') return openTTSEvent(target.dataset.ttsEvent);
      if (action === 'manage-credential') {
        ttsCredentialState.modalOpen = true;
        ttsCredentialState.confirmDelete = false;
        rerenderTTS();
        window.setTimeout(() => document.querySelector('#tts-api-key-input')?.focus(), 0);
        return;
      }
      if (action === 'close-credential') {
        ttsCredentialState.modalOpen = false;
        ttsCredentialState.confirmDelete = false;
        rerenderTTS();
        return;
      }
      if (action === 'save-credential') {
        const input = document.querySelector('#tts-api-key-input');
        const error = document.querySelector('#tts-api-key-error');
        if (!input || input.value.trim().length < 8) {
          if (error) error.textContent = '原型中请输入至少 8 位演示字符；不要输入真实 Key。';
          input?.focus();
          return;
        }
        input.value = '';
        ttsCredentialState.ready = true;
        ttsCredentialState.modalOpen = false;
        ttsCredentialState.confirmDelete = false;
        ttsState.promptError = '';
        rerenderTTS();
        showToast('原型状态：API Key 已配置；没有联网或持久化');
        return;
      }
      if (action === 'delete-credential') {
        ttsCredentialState.confirmDelete = true;
        rerenderTTS();
        return;
      }
      if (action === 'cancel-delete-credential') {
        ttsCredentialState.confirmDelete = false;
        rerenderTTS();
        return;
      }
      if (action === 'confirm-delete-credential') {
        ttsCredentialState.ready = false;
        ttsCredentialState.modalOpen = false;
        ttsCredentialState.confirmDelete = false;
        rerenderTTS();
        showToast('原型状态：API Key 已删除；已采用提示音保持不变');
        return;
      }
      if (action === 'collapse-inline') {
        ttsState.playing = null;
        ttsState.inlineOpen = false;
        rerenderTTS();
        showToast('生成区已收起；当前声音没有改变');
        return;
      }
      if (action === 'edit-prompt') {
        ttsState.confirmedSoundPlan = null;
        return setTTSStage('prompt');
      }
      if (action === 'generate' || action === 'regenerate') return beginTTSGeneration();
      if (action === 'play-candidate') {
        const candidate = target.dataset.ttsCandidate;
        ttsState.playing = ttsState.playing === candidate ? null : candidate;
        rerenderTTS();
        return;
      }
      if (action === 'simulate-failure') return setTTSStage('failed');
      if (action === 'retry') return setTTSStage('candidates');
      if (action === 'adopt') {
        const nameError = validateTTSCueName(ttsState.cueName);
        if (nameError) {
          ttsState.nameError = nameError;
          rerenderTTS();
          window.setTimeout(() => document.querySelector('#tts-final-name')?.focus(), 0);
          return;
        }
        ttsState.cueName = ttsState.cueName.trim();
        if (target.dataset.ttsCandidate) ttsState.selectedCandidate = target.dataset.ttsCandidate;
        ttsState.stage = 'importing';
        ttsState.playing = null;
        rerenderTTS();
        ttsTransitionTimer = window.setTimeout(() => {
          if (ttsState.stage !== 'importing') return;
          const candidateID = ttsState.selectedCandidate;
          const eventID = ttsState.eventId;
          const binding = {
            file: `cue-${eventID}-${candidateID.toLowerCase()}.aiff`,
            label: ttsState.cueName
          };
          ttsBindings[eventID] = binding;
          const eventItem = eventById('workbuddy', eventID);
          if (eventItem) eventItem.sound = binding.label;
          ttsState.stage = 'applied';
          rerenderTTS();
        }, 850);
      }
    }

    document.addEventListener('click', event => {
      const ttsAction = event.target.closest('[data-tts-action]');
      if (ttsAction && isTTSPrototype) {
        handleTTSAction(ttsAction);
        return;
      }
      const panelScopeToggle = event.target.closest('[data-panel-scope-toggle]');
      if (panelScopeToggle) {
        const menu = document.querySelector('#panel-app-menu');
        if (menu) {
          const expanded = panelScopeToggle.getAttribute('aria-expanded') === 'true';
          panelScopeToggle.setAttribute('aria-expanded', expanded ? 'false' : 'true');
          menu.hidden = expanded;
        }
        return;
      }
      const panelAppOption = event.target.closest('[data-panel-app]');
      if (panelAppOption) {
        panelSelectedApp = panelAppOption.dataset.panelApp;
        selectedApp = panelSelectedApp;
        renderPanel();
        showToast(`正在查看 ${panelAppById(panelSelectedApp).name} 的声音配置`);
        return;
      }
      const panelAction = event.target.closest('[data-panel-action]');
      if (panelAction) {
        const name = panelAction.dataset.panelAction;
        const app = panelAppById(panelAction.dataset.panelApp || panelSelectedApp);
        const item = panelAction.dataset.panelEvent ? eventById(app.id, panelAction.dataset.panelEvent) : null;
        if (name === 'mute' && item && item.availability !== 'unavailable') {
          item.enabled = !item.enabled;
          renderPanel();
          showToast(`${app.name} · ${item.name} 已${item.enabled ? '开启' : '静音'}`);
        }
        else if (name === 'play' && item) showToast(`${app.name} · 正在试听 ${item.name}`);
        else if (name === 'open-settings') window.location.href = `${window.location.pathname}?page=events&app=${app.id}`;
        else if (name === 'reset-surface') showToast(`${app.name} 已重置为继承全局默认`);
        else if (name === 'language') showToast('界面语言设置将在正式面板中打开');
        else if (name === 'close') showToast('原型演示：关闭菜单栏面板');
        return;
      }
      const pageButton = event.target.closest('[data-page]');
      if (pageButton) { setPage(pageButton.dataset.page); return; }
      const eventAppButton = event.target.closest('[data-event-app]');
      if (eventAppButton) { selectedApp = eventAppButton.dataset.eventApp; setPage('events'); showToast(`正在管理 ${appById(selectedApp).name} 的事件`); return; }
      const appToggle = event.target.closest('[data-app-toggle]');
      if (appToggle) {
        const app = appById(appToggle.dataset.appToggle);
        app.enabled = !app.enabled;
        setPage('apps');
        showToast(`${app.name} 已${app.enabled ? '启用' : '停用'}`);
        return;
      }
      const eventToggle = event.target.closest('[data-event-toggle]');
      if (eventToggle) {
        const item = eventById(eventToggle.dataset.eventAppId, eventToggle.dataset.eventToggle);
        if (item) { item.enabled = !item.enabled; setPage('events'); showToast(`${appById(eventToggle.dataset.eventAppId).name} · ${item.name} 已${item.enabled ? '开启' : '关闭'}`); }
        return;
      }
      const pageTarget = event.target.closest('[data-page-target]');
      if (pageTarget) { if (pageTarget.dataset.appTarget) selectedApp = pageTarget.dataset.appTarget; setPage(pageTarget.dataset.pageTarget); return; }
      const appButton = event.target.closest('[data-app]');
      if (appButton) { selectedApp = appButton.dataset.app; setPage('apps'); showToast(`已查看 ${appById(selectedApp).name}`); return; }
      const toggle = event.target.closest('[data-toggle]');
      if (toggle) { toggle.classList.toggle('on'); toggle.setAttribute('aria-pressed', toggle.classList.contains('on') ? 'true' : 'false'); showToast(`${toggle.dataset.toggle}已${toggle.classList.contains('on') ? '开启' : '关闭'}`); return; }
      const action = event.target.closest('[data-action]');
      if (!action) return;
      const name = action.dataset.action;
      if (name === 'play' || name === 'play-all') {
        const appName = action.dataset.appId ? appById(action.dataset.appId).name : appById(selectedApp).name;
        const eventName = action.dataset.event ? eventById(action.dataset.appId || selectedApp, action.dataset.event)?.name || action.dataset.event : '全部事件';
        showToast(`${appName} · 正在试听${eventName === '全部事件' ? eventName : ` ${eventName}`}`);
      }
      else if (name === 'refresh') showToast('已重新检测；真实激活仍需宿主 receipt');
      else if (name === 'clear-receipts') {
        if (window.confirm(`清除 ${appById(selectedApp).name} 的脱敏回执历史？当前连接和声音偏好不会改变。`)) showToast('已清除脱敏回执历史（原型状态）');
      }
      else if (name === 'inspect') showToast('原型占位：只读查看宿主配置');
      else if (name === 'sound-packs') setPage('sounds');
      else if (name === 'import') showToast('原型占位：选择本地声音包');
      else if (name === 'preview-pack') showToast('正在试听声音包');
      else if (name === 'select-pack') showToast('已选择 Minimal（演示状态）');
      else showToast('原型占位：此操作将在正式 UI 接入');
    });
    document.addEventListener('keydown', event => {
      if (!isTTSPrototype || event.key !== 'Escape') return;
      if (ttsCredentialState.modalOpen) {
        ttsCredentialState.modalOpen = false;
        ttsCredentialState.confirmDelete = false;
        rerenderTTS();
        return;
      }
    });
    document.addEventListener('input', event => {
      const ttsFinalName = event.target.closest('[data-tts-field="final-name"]');
      if (ttsFinalName && isTTSPrototype) {
        ttsState.cueName = ttsFinalName.value;
        ttsState.cueNameIsManual = Boolean(ttsFinalName.value.trim());
        ttsState.nameError = '';
        ttsFinalName.setAttribute('aria-invalid', 'false');
        const nameError = document.querySelector('#tts-final-name-error');
        if (nameError) nameError.textContent = '';
        return;
      }
      const ttsApiKey = event.target.closest('#tts-api-key-input');
      if (ttsApiKey && isTTSPrototype) {
        const error = document.querySelector('#tts-api-key-error');
        if (error) error.textContent = '';
        return;
      }
      const ttsPrompt = event.target.closest('[data-tts-field="prompt"]');
      if (ttsPrompt && isTTSPrototype) {
        ttsState.prompt = ttsPrompt.value;
        ttsState.promptError = '';
        ttsState.confirmedSoundPlan = null;
        return;
      }
      const panelRange = event.target.closest('[data-panel-range]');
      if (panelRange) {
        const output = document.querySelector('[data-panel-range-value]');
        if (output) output.textContent = `${panelRange.value}%`;
        return;
      }
      const range = event.target.closest('[data-range]');
      if (!range) return;
      const output = document.querySelector(`[data-range-value="${range.dataset.range}"]`);
      if (!output) return;
      output.textContent = range.dataset.range.includes('主音量') ? `${range.value}%` : `${(Number(range.value) / 100).toFixed(2)}s`;
    });
    if (isPanelSurface) {
      document.documentElement.classList.add('panel-mode');
      document.body.classList.add('panel-mode');
      renderPanel();
    } else {
      if (isTTSPrototype) {
        document.body.classList.add('tts-prototype-mode');
        const sidebarFootCopy = document.querySelector('#sidebar-foot-copy');
        if (sidebarFootCopy) sidebarFootCopy.textContent = 'BYOK · API Key 仅存钥匙串';
      }
      setPage(activePage);
    }
  </script>
</body>
</html>
