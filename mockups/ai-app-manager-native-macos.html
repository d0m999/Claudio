<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claudio · Native macOS AI app manager prototype</title>
  <style>
    :root {
      --window: #fbfbfd;
      --sidebar: #f1f1f3;
      --sidebar-deep: #e5e5e7;
      --group: #f5f5f6;
      --group-hover: #ededf0;
      --text: #1d1d1f;
      --secondary: #6e6e73;
      --tertiary: #98989d;
      --separator: #d8d8dc;
      --blue: #0a84ff;
      --green: #34c759;
      --orange: #ff9f0a;
      --red: #ff453a;
      --purple: #af52de;
      --teal: #30b0c7;
      --shadow: 0 30px 80px rgba(0, 0, 0, .22), 0 2px 12px rgba(0, 0, 0, .12);
    }

    * { box-sizing: border-box; }
    html { min-width: 1024px; background: #d7d7da; }
    body {
      min-width: 1024px;
      min-height: 100vh;
      margin: 0;
      padding: 30px;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(circle at 50% -20%, rgba(255,255,255,.8), transparent 48%),
        linear-gradient(#e1e1e3, #d4d4d7);
    }
    button, input, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid rgba(10,132,255,.35); outline-offset: 2px; }

    .window {
      position: relative;
      display: grid;
      grid-template-columns: 252px minmax(0, 1fr);
      width: min(1240px, calc(100vw - 60px));
      min-height: 820px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,.18);
      border-radius: 18px;
      background: var(--window);
      box-shadow: var(--shadow);
    }

    .traffic-lights {
      position: absolute;
      z-index: 5;
      top: 17px;
      left: 17px;
      display: flex;
      gap: 8px;
    }
    .traffic-light { width: 13px; height: 13px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.13); }
    .traffic-light.red { background: #ff5f57; }
    .traffic-light.yellow { background: #febc2e; }
    .traffic-light.green { background: #28c840; }

    .sidebar {
      min-height: 820px;
      padding: 58px 13px 18px;
      border-right: 1px solid rgba(0,0,0,.08);
      background: rgba(239,239,241,.88);
    }
    .sidebar-brand { display: flex; align-items: center; gap: 9px; padding: 0 9px 19px; }
    .brand-mark { display: block; width: 28px; height: 28px; flex: 0 0 28px; border-radius: 8px; object-fit: cover; box-shadow: 0 1px 2px rgba(0,0,0,.14); }
    .brand-name { font-size: 15px; font-weight: 750; letter-spacing: -.02em; }
    .sidebar-group { margin-top: 14px; }
    .sidebar-heading { padding: 0 10px 6px; color: var(--secondary); font-size: 11px; font-weight: 700; }
    .sidebar-heading.first { display: none; }
    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 37px;
      padding: 6px 10px;
      border: 0;
      border-radius: 9px;
      color: #454548;
      background: transparent;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      font-weight: 520;
    }
    .sidebar-item:hover { background: rgba(255,255,255,.65); }
    .sidebar-item.active { color: var(--text); background: #d6d6d8; font-weight: 680; box-shadow: inset 0 0 0 1px rgba(0,0,0,.035); }
    .sidebar-icon { display: grid; place-items: center; width: 25px; height: 25px; flex: 0 0 25px; border-radius: 7px; color: #fff; line-height: 1; box-shadow: inset 0 .5px 0 rgba(255,255,255,.22), inset 0 0 0 .5px rgba(0,0,0,.08), 0 1px 1px rgba(0,0,0,.08); }
    .sidebar-symbol { width: 15px; height: 15px; overflow: visible; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    .sidebar-symbol .symbol-fill { fill: currentColor; stroke: none; }
    .sidebar-icon.gray { background: #858589; }
    .sidebar-icon.blue { background: #20aee2; }
    .sidebar-icon.red { background: #ff3b47; }
    .sidebar-icon.purple { background: #6f59e8; }
    .sidebar-icon.green { background: #2fca5b; }
    .sidebar-icon.pink { background: #f53573; }
    .sidebar-icon.violet { background: #bb4ed9; }
    .sidebar-separator { height: 1px; margin: 13px 9px; background: rgba(0,0,0,.08); }
    .sidebar-foot { display: flex; align-items: center; gap: 7px; margin-top: 18px; padding: 8px 10px; color: var(--tertiary); font-size: 10px; font-weight: 650; }
    .sidebar-foot-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }

    .content {
      min-width: 0;
      min-height: 820px;
      padding: 60px 52px 52px;
      overflow: auto;
      background: var(--window);
    }
    .content-inner { width: min(820px, 100%); margin: 0 auto; }
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 32px; }
    .page-header h1 { margin: 0; font-size: 30px; font-weight: 720; letter-spacing: -.045em; line-height: 1.1; }
    .page-header p { max-width: 620px; margin: 8px 0 0; color: var(--secondary); font-size: 13px; line-height: 1.45; }
    .page-header-actions { display: flex; align-items: center; gap: 9px; padding-top: 2px; }
    .demo-label { color: var(--tertiary); font-size: 10px; font-weight: 700; white-space: nowrap; }
    .plain-button, .blue-button {
      min-height: 31px;
      padding: 0 12px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }
    .plain-button { color: var(--text); background: #e8e8eb; box-shadow: inset 0 0 0 1px rgba(0,0,0,.05); }
    .plain-button:hover { background: #dedee1; }
    .blue-button { color: #fff; background: var(--blue); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
    .blue-button:hover { background: #0077ed; }

    .section-label { margin: 0 0 8px 4px; color: var(--secondary); font-size: 13px; font-weight: 650; }
    .section-label + .settings-group { margin-top: 0; }
    .settings-group { margin: 24px 0 0; overflow: hidden; border-radius: 12px; background: var(--group); box-shadow: inset 0 0 0 1px rgba(0,0,0,.035); }
    .settings-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 20px; min-height: 57px; padding: 10px 18px; border-bottom: 1px solid var(--separator); }
    .settings-row:last-child { border-bottom: 0; }
    .settings-row.tall { min-height: 70px; }
    .settings-row:hover { background: rgba(255,255,255,.32); }
    .row-title { color: var(--text); font-size: 14px; font-weight: 560; }
    .row-caption { margin-top: 4px; color: var(--secondary); font-size: 12px; line-height: 1.35; }
    .row-caption code, .code { color: var(--secondary); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .row-control { display: flex; align-items: center; justify-content: flex-end; gap: 10px; min-width: 100px; }
    .row-value { color: var(--secondary); font-size: 13px; white-space: nowrap; }
    select.native-select { min-width: 108px; padding: 6px 26px 6px 10px; border: 0; border-radius: 7px; color: var(--text); background: #e8e8eb; font-size: 13px; font-weight: 520; }
    .native-range { width: 190px; accent-color: var(--blue); }
    .range-value { min-width: 44px; color: var(--secondary); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; text-align: right; }
    .toggle { position: relative; width: 38px; height: 22px; padding: 0; border: 0; border-radius: 999px; background: #c7c7cc; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
    .toggle::after { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; content: ""; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .16s ease; }
    .toggle.on { background: var(--green); }
    .toggle.on::after { transform: translateX(16px); }
    .toggle.blue.on { background: var(--blue); }

    .app-list { overflow: hidden; border-radius: 12px; background: var(--group); box-shadow: inset 0 0 0 1px rgba(0,0,0,.035); }
    .app-row { display: grid; grid-template-columns: minmax(0,1fr) auto 62px 38px; align-items: center; gap: 13px; min-height: 58px; padding: 0 18px; border: 0; border-bottom: 1px solid var(--separator); color: var(--text); background: transparent; }
    .app-row:last-child { border-bottom: 0; }
    .app-row:hover { background: var(--group-hover); }
    .app-row-select { display: flex; align-items: center; min-width: 0; min-height: 58px; padding: 8px 0; border: 0; color: inherit; background: transparent; text-align: left; cursor: pointer; }
    .app-row.selected { background: #e8e8eb; }
    .app-name { font-size: 14px; font-weight: 650; }
    .app-coverage { color: var(--secondary); font-size: 11px; font-weight: 650; white-space: nowrap; }
    .app-connect-toggle { justify-self: end; }
    .status { display: inline-flex; align-items: center; gap: 6px; color: var(--secondary); font-size: 11px; font-weight: 650; white-space: nowrap; }
    .status-dot { display: grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; color: #fff; background: var(--tertiary); font-size: 10px; font-weight: 800; line-height: 1; }
    .status-dot::after { content: "·"; }
    .status.ready { color: #258c3f; }
    .status.ready .status-dot { background: var(--green); }
    .status.ready .status-dot::after { content: "✓"; }
    .status.waiting { color: #a76e00; }
    .status.waiting .status-dot { background: var(--orange); }
    .status.waiting .status-dot::after { content: "!"; }
    .status.partial { color: #b05c29; }
    .status.partial .status-dot { background: var(--orange); }
    .status.partial .status-dot::after { content: "!"; }
    .status.unavailable { color: var(--secondary); }
    .status.unavailable .status-dot::after { content: "–"; }
    .app-hint { margin: 14px 4px 0; color: var(--secondary); font-size: 12px; line-height: 1.4; }

    .detail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 17px; }
    .detail-title { font-size: 17px; font-weight: 680; letter-spacing: -.025em; }
    .detail-subtitle { margin-top: 4px; color: var(--secondary); font-size: 11px; }
    .detail-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .event-row { display: grid; grid-template-columns: 27px minmax(0,1fr) auto 84px; align-items: center; gap: 11px; min-height: 60px; padding: 9px 18px; border-bottom: 1px solid var(--separator); }
    .event-row.scoped { grid-template-columns: 27px minmax(0,1fr) auto 38px 106px; }
    .event-row.preview { grid-template-columns: 27px minmax(0,1fr) auto 84px; }
    .event-row:last-child { border-bottom: 0; }
    .event-symbol { display: grid; place-items: center; width: 25px; height: 25px; border-radius: 7px; color: var(--blue); background: #dceeff; font-size: 12px; font-weight: 800; }
    .event-symbol.green { color: #258c3f; background: #dff5e3; }
    .event-symbol.orange { color: #a76e00; background: #fff0d2; }
    .event-symbol.purple { color: #8642ab; background: #f0ddfa; }
    .event-name { font-size: 13px; font-weight: 600; }
    .event-code { margin-top: 4px; color: var(--secondary); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
    .event-coverage { color: var(--secondary); font-size: 11px; white-space: nowrap; }
    .event-sound { color: var(--blue); font-size: 11px; font-weight: 650; text-align: right; }
    .event-sound .plain-button { min-width: 100px; padding-inline: 8px; }
    .event-layout { display: grid; grid-template-columns: 224px minmax(0,1fr); align-items: start; gap: 14px; }
    .event-app-nav { position: sticky; top: 0; min-width: 0; max-height: 548px; padding: 8px; overflow: auto; border-radius: 12px; background: var(--group); box-shadow: inset 0 0 0 1px rgba(0,0,0,.035); }
    .event-app-nav-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 5px 6px 9px; }
    .scope-eyebrow { color: var(--tertiary); font-size: 10px; font-weight: 700; }
    .event-app-nav-title { margin-top: 3px; color: var(--text); font-size: 12px; font-weight: 680; }
    .event-app-count { color: var(--tertiary); font-size: 10px; line-height: 1.35; text-align: right; white-space: nowrap; }
    .event-app-picker { display: grid; gap: 2px; }
    .event-app-option { display: block; width: 100%; min-height: 58px; padding: 8px 10px; border: 0; border-radius: 9px; color: var(--secondary); background: transparent; cursor: pointer; text-align: left; }
    .event-app-option:hover { background: var(--group-hover); }
    .event-app-option.active { color: var(--text); background: #dedee1; box-shadow: inset 0 0 0 1px rgba(0,0,0,.045); }
    .event-app-option-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .event-app-option .app-name { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 650; }
    .event-app-option-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 5px; }
    .event-app-option .status { gap: 4px; font-size: 10px; }
    .event-app-option .status-dot { width: 14px; height: 14px; font-size: 9px; }
    .event-app-option .app-coverage { color: var(--tertiary); font-size: 10px; font-weight: 650; white-space: nowrap; }
    .event-app-option.active .app-coverage { color: var(--secondary); }
    .event-app-nav-foot { margin: 8px 6px 2px; padding-top: 8px; border-top: 1px solid var(--separator); color: var(--tertiary); font-size: 10px; line-height: 1.4; }
    .event-detail { min-width: 0; }
    .event-detail-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 2px 18px; }
    .event-detail-title { color: var(--text); font-size: 17px; font-weight: 680; letter-spacing: -.025em; }
    .event-detail-subtitle { margin-top: 4px; color: var(--secondary); font-size: 11px; }
    .event-toggle { justify-self: end; }
    .info-callout { display: flex; align-items: flex-start; gap: 9px; margin-top: 13px; padding: 11px 13px; border-radius: 10px; color: var(--secondary); background: #f2f2f4; font-size: 11px; line-height: 1.45; }
    .info-icon { display: grid; place-items: center; width: 17px; height: 17px; flex: 0 0 17px; border-radius: 50%; color: #fff; background: var(--secondary); font-size: 11px; font-weight: 800; }

    .empty-page { padding: 30px 4px; color: var(--secondary); }
    .empty-page h2 { margin: 0; color: var(--text); font-size: 20px; font-weight: 680; }
    .empty-page p { max-width: 560px; margin: 8px 0 0; font-size: 13px; line-height: 1.5; }
    .mini-stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 24px; }
    .mini-stat { padding: 17px; border-radius: 12px; background: var(--group); }
    .mini-stat strong { display: block; font-size: 23px; font-weight: 720; letter-spacing: -.05em; }
    .mini-stat span { display: block; margin-top: 5px; color: var(--secondary); font-size: 11px; }
    .toast { position: fixed; right: 24px; bottom: 22px; padding: 10px 13px; border-radius: 9px; color: #fff; background: rgba(30,30,32,.92); font-size: 12px; font-weight: 600; opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .16s ease, transform .16s ease; }
    .toast.visible { opacity: 1; transform: translateY(0); }

    /* 桌面菜单栏弹窗：与设置页共享 apps / eventsByApp 状态，但保留更紧凑的深色面板层级。 */
    .panel-surface[hidden] { display: none; }
    .panel-surface {
      width: min(624px, calc(100vw - 56px));
      min-height: 720px;
      margin: 0 auto;
      overflow: hidden;
      border: 2px solid #6b6862;
      border-radius: 31px;
      color: #f0ece5;
      background:
        linear-gradient(145deg, rgba(255,255,255,.018), transparent 42%),
        #191816;
      box-shadow: 0 24px 70px rgba(0,0,0,.54);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "PingFang SC", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .panel-content { display: grid; gap: 19px; padding: 22px 27px 18px; }
    .panel-topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    .panel-wordmark { display: inline-flex; align-items: center; height: 43px; color: #f0ece5; font-size: 35px; font-weight: 730; letter-spacing: -2.3px; line-height: 1; }
    .panel-wordmark img { width: 52px; height: 52px; margin-left: -7px; }
    .panel-interface-button { min-width: 104px; height: 54px; border: 0; border-radius: 13px; color: #e37e5d; background: #211c18; font-size: 28px; font-weight: 720; cursor: pointer; }
    .panel-interface-button:hover { background: #2a211c; }
    .panel-heading { margin-top: 5px; }
    .panel-heading h1 { margin: 0; font-size: 27px; font-weight: 720; letter-spacing: -.7px; line-height: 1.2; }
    .panel-summary { margin: 6px 0 0; color: #b7b1a8; font-size: 20px; font-weight: 590; }
    .panel-section { display: grid; gap: 9px; }
    .panel-section-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .panel-section-title { margin: 0; color: #b7b1a8; font-size: 19px; font-weight: 720; letter-spacing: -.1px; }
    .panel-section-caption { color: #8d877f; font-size: 11px; font-weight: 600; text-align: right; }
    .panel-scope-wrap { position: relative; }
    .panel-scope-button {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 68px;
      padding: 12px 15px;
      border: 2px solid #47423e;
      border-radius: 18px;
      color: #f0ece5;
      background: rgba(36,33,30,.78);
      text-align: left;
      cursor: pointer;
    }
    .panel-scope-button:hover, .panel-scope-button[aria-expanded="true"] { border-color: #77736d; background: #2c2824; }
    .panel-scope-copy { display: grid; min-width: 0; gap: 4px; }
    .panel-scope-name { overflow: hidden; font-size: 21px; font-weight: 720; text-overflow: ellipsis; white-space: nowrap; }
    .panel-scope-detail { color: #b7b1a8; font-size: 14px; font-weight: 620; }
    .panel-scope-button .status { margin-left: auto; }
    .panel-chevron { margin-left: 13px; color: #b7b1a8; font-size: 22px; line-height: 1; transform: translateY(-2px); }
    .panel-scope-menu {
      position: absolute;
      z-index: 10;
      top: calc(100% + 7px);
      right: 0;
      left: 0;
      display: grid;
      gap: 3px;
      max-height: 260px;
      padding: 7px;
      overflow: auto;
      border: 1px solid #6b6862;
      border-radius: 16px;
      background: #24211e;
      box-shadow: 0 16px 32px rgba(0,0,0,.42);
    }
    .panel-scope-menu[hidden] { display: none; }
    .panel-app-option {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 53px;
      padding: 8px 10px;
      border: 0;
      border-radius: 11px;
      color: #b7b1a8;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .panel-app-option:hover, .panel-app-option.active { color: #f0ece5; background: #342e29; }
    .panel-app-option-copy { display: grid; min-width: 0; gap: 3px; }
    .panel-app-option-name { overflow: hidden; font-size: 15px; font-weight: 680; text-overflow: ellipsis; white-space: nowrap; }
    .panel-app-option-meta { color: #8d877f; font-size: 11px; font-weight: 600; }
    .panel-app-option .status { margin-left: auto; }
    .panel-surface .status { display: inline-flex; align-items: center; gap: 6px; color: #b7b1a8; font-size: 12px; font-weight: 650; white-space: nowrap; }
    .panel-surface .status-dot { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; color: #191816; background: #8d877f; font-size: 11px; font-weight: 900; }
    .panel-surface .status-dot::after { content: "·"; }
    .panel-surface .status.ready { color: #72df8b; }
    .panel-surface .status.ready .status-dot { color: #122318; background: #36d465; }
    .panel-surface .status.ready .status-dot::after { content: "✓"; }
    .panel-surface .status.waiting { color: #ffbd59; }
    .panel-surface .status.waiting .status-dot { color: #2d2310; background: #ffa200; }
    .panel-surface .status.waiting .status-dot::after { content: "!"; }
    .panel-surface .status.partial { color: #ffbd59; }
    .panel-surface .status.partial .status-dot { color: #2d2310; background: #ffa200; }
    .panel-surface .status.partial .status-dot::after { content: "!"; }
    .panel-surface .status.unavailable { color: #8d877f; }
    .panel-surface .status.unavailable .status-dot::after { content: "–"; }
    .panel-event-list { display: grid; }
    .panel-event-row { display: grid; grid-template-columns: 48px minmax(0,1fr) auto; align-items: center; gap: 12px; min-height: 89px; padding: 12px 0; border-bottom: 1px solid #47423e; }
    .panel-event-row:last-child { border-bottom: 0; }
    .panel-event-row.is-disabled .panel-event-title { color: #b7b1a8; }
    .panel-event-icon { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 13px; }
    .panel-event-icon svg { width: 29px; height: 29px; }
    .panel-event-icon.task { color: #2387f3; background: #192d48; }
    .panel-event-icon.complete { color: #36d465; background: #183d25; }
    .panel-event-icon.interrupted { color: #ffa200; background: #3c2c16; }
    .panel-event-icon.response { color: #e37e5d; background: #3b2823; }
    .panel-event-icon.subtask { color: #6567ed; background: #292742; }
    .panel-event-copy { display: grid; min-width: 0; gap: 7px; }
    .panel-event-title { overflow: hidden; color: #f0ece5; font-size: 21px; font-weight: 710; letter-spacing: -.35px; line-height: 1.08; text-overflow: ellipsis; white-space: nowrap; }

    .panel-icon-button:hover { background: rgba(255,255,255,.06); }

    .panel-icon-button.muted svg { width: 32px; height: 32px; }

    .panel-control-row { display: grid; grid-template-columns: minmax(0,1fr) minmax(190px, 1fr); align-items: center; gap: 15px; min-height: 70px; padding: 12px 15px; border-bottom: 1px solid #47423e; }

    .panel-control-action { min-width: 71px; min-height: 34px; padding: 0 11px; border: 1px solid #6b6862; border-radius: 10px; color: #f0ece5; background: #342e29; font-size: 12px; font-weight: 680; cursor: pointer; }

    /*
     * THROWAWAY TTS PROTOTYPE:
     * The selected inline core loop is embedded in the existing Events page,
     * gated by ?prototype=tts. The original page is unchanged without it.
     * Question: can the internal sound plan stay hidden while users describe
     * first, then name the chosen cue beside its candidates, with BYOK service
     * configuration kept outside the per-event generation form?
     */
    .tts-prototype-mode .window,
    .tts-prototype-mode .sidebar,
    .tts-prototype-mode .content { min-height: 900px; }
    .tts-prototype-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      color: #6e4b9e;
      background: rgba(175,82,222,.11);
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;

    .tts-service-card {
      display: grid;
      grid-template-columns: 34px minmax(0,1fr) auto auto;
      align-items: center;
      gap: 10px;
      min-height: 58px;
      margin: -13px 0 22px;
      padding: 9px 11px;
      border: 1px solid var(--separator);
      border-radius: 11px;
      background: var(--group);

    .tts-service-icon {
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      border-radius: 9px;

      background: rgba(10,132,255,.11);
      font-size: 15px;
      font-weight: 750;
    }
    .tts-service-copy { min-width: 0; }
    .tts-service-title { color: var(--text); font-size: 12px; font-weight: 700; }
    .tts-service-meta { margin-top: 3px; color: var(--secondary); font-size: 10px; line-height: 1.35; }

    .tts-service-status::before { width: 7px; height: 7px; border-radius: 50%; content: ""; background: var(--orange); }
    .tts-service-status.ready { color: #258c3f; }
    .tts-service-status.ready::before { background: var(--green); }
    .tts-event-group { overflow: visible; }
    .event-row.tts-event-row { grid-template-columns: 27px minmax(0,1fr) auto 38px minmax(126px, 168px); }
    .event-row.tts-event-row .event-code { display: block; }
    .event-row.tts-event-row.selected {
      background: rgba(10,132,255,.075);

    }
    .tts-sound-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; min-width: 0; }
    .tts-sound-actions .plain-button { min-width: 0; max-width: 91px; overflow: hidden; padding-inline: 8px; text-overflow: ellipsis; white-space: nowrap; }
    .tts-create-button {
      min-height: 29px;
      padding: 0 8px;
      border: 0;
      border-radius: 7px;
      color: var(--blue);
      background: rgba(10,132,255,.10);
      cursor: pointer;
      font-size: 11px;
      font-weight: 720;
      white-space: nowrap;
    }
    .tts-create-button:hover { background: rgba(10,132,255,.17); }
    .tts-create-button:disabled { color: var(--tertiary); background: transparent; cursor: default; }
    .tts-inline {
      padding: 15px 16px 16px;
      border-bottom: 1px solid var(--separator);
      background: rgba(10,132,255,.035);
    }
    .tts-inline-head,
    .tts-card-head,
    .tts-action-row,
    .tts-request-summary,
    .tts-status-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .tts-inline-head { margin-bottom: 12px; }
    .tts-inline-title { color: var(--text); font-size: 13px; font-weight: 700; }
    .tts-inline-meta { margin-top: 3px; color: var(--secondary); font-size: 10px; line-height: 1.35; }
    .tts-link-button {
      padding: 4px 6px;
      border: 0;
      color: var(--blue);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
    }
    .tts-link-button:hover { text-decoration: underline; }
    .tts-steps { display: flex; align-items: center; gap: 6px; margin-bottom: 11px; }
    .tts-step {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--tertiary);
      font-size: 10px;
      font-weight: 650;
      white-space: nowrap;
    }
    .tts-step::after { width: 18px; height: 1px; margin-left: 1px; content: ""; background: var(--separator); }
    .tts-step:last-child::after { display: none; }
    .tts-step-number { display: grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; color: var(--secondary); background: var(--group-hover); font-size: 9px; }
    .tts-step.active { color: var(--text); }
    .tts-step.active .tts-step-number { color: #fff; background: var(--blue); }
    .tts-step.done { color: var(--secondary); }
    .tts-step.done .tts-step-number { color: #fff; background: var(--green); }
    .tts-card {
      padding: 12px;
      border: 1px solid var(--separator);
      border-radius: 10px;
      background: color-mix(in srgb, var(--window) 88%, transparent);
    }
    .tts-card + .tts-card { margin-top: 9px; }
    .tts-card-title { color: var(--text); font-size: 12px; font-weight: 700; }
    .tts-helper { color: var(--secondary); font-size: 10px; line-height: 1.4; }
    .tts-prompt-label { display: block; margin-bottom: 6px; color: var(--secondary); font-size: 10px; font-weight: 700; }
    .tts-name-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 10px; }
    .tts-name-field { min-width: 0; }
    .tts-name-input,
    .tts-secret-input {
      display: block;
      width: 100%;
      min-height: 34px;
      padding: 7px 9px;
      border: 1px solid var(--separator);
      border-radius: 8px;
      color: var(--text);
      background: var(--window);
      font-size: 11px;
    }
    .tts-name-input:focus,
    .tts-secret-input:focus { outline: 3px solid rgba(10,132,255,.20); border-color: var(--blue); }
    .tts-name-hint { padding-bottom: 8px; color: var(--tertiary); font-size: 9px; text-align: right; white-space: nowrap; }
    .tts-prompt {
      display: block;
      width: 100%;
      min-height: 74px;
      resize: vertical;
      padding: 9px 10px;
      border: 1px solid var(--separator);
      border-radius: 8px;
      color: var(--text);
      background: var(--window);
      font: 12px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    }
    .tts-prompt:focus { outline: 3px solid rgba(10,132,255,.20); border-color: var(--blue); }
    .tts-prompt-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 9px; }
    .tts-error { min-height: 14px; color: var(--red); font-size: 10px; }
    .tts-primary-button,
    .tts-secondary-button,
    .tts-icon-button,
    .tts-small-button {
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-weight: 680;
    }
    .tts-primary-button { min-height: 31px; padding: 0 12px; color: #fff; background: var(--blue); font-size: 11px; }
    .tts-primary-button:hover { background: #0077ed; }
    .tts-secondary-button { min-height: 31px; padding: 0 11px; color: var(--text); background: var(--group-hover); font-size: 11px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.04); }
    .tts-secondary-button:hover { filter: brightness(.96); }
    .tts-small-button { min-height: 27px; padding: 0 8px; color: var(--blue); background: rgba(10,132,255,.10); font-size: 10px; white-space: nowrap; }
    .tts-icon-button { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; color: var(--blue); background: var(--group-hover); font-size: 10px; }
    .tts-icon-button.playing { color: #fff; background: var(--blue); }
    .tts-request-summary {
      display: grid;
      gap: 7px;
      min-height: 56px;
      margin-bottom: 9px;
      padding: 10px;
      border: 1px solid var(--separator);
      border-radius: 9px;
      background: color-mix(in srgb, var(--window) 88%, transparent);
    }
    .tts-name-support { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .tts-name-support .tts-error { flex: 0 0 auto; text-align: right; }
    .tts-summary-description { display: flex; align-items: center; justify-content: space-between; min-width: 0; gap: 8px; padding-top: 7px; border-top: 1px solid var(--separator); color: var(--secondary); font-size: 10px; line-height: 1.45; }
    .tts-summary-description strong { color: var(--text); }
    .tts-summary-line { display: flex; align-items: center; min-width: 0; gap: 6px; }
    .tts-summary-value { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tts-candidate-list { display: grid; gap: 6px; }
    .tts-candidate-row {
      display: grid;
      grid-template-columns: 28px minmax(0,1fr) 68px auto;
      align-items: center;
      gap: 8px;
      min-height: 50px;
      padding: 6px 8px;
      border: 1px solid var(--separator);
      border-radius: 9px;
      background: var(--window);
      cursor: default;
    }
    .tts-candidate-name { color: var(--text); font-size: 11px; font-weight: 700; }
    .tts-candidate-meta { margin-top: 3px; color: var(--secondary); font-size: 9px; white-space: nowrap; }
    .tts-sim-badge { color: #6e4b9e; font-weight: 700; }
    .tts-wave { display: flex; align-items: center; justify-content: center; gap: 2px; height: 24px; color: var(--blue); }
    .tts-wave i { display: block; width: 2px; border-radius: 2px; background: currentColor; opacity: .62; }
    .tts-wave i:nth-child(1), .tts-wave i:nth-child(7) { height: 7px; }
    .tts-wave i:nth-child(2), .tts-wave i:nth-child(6) { height: 14px; }
    .tts-wave i:nth-child(3), .tts-wave i:nth-child(5) { height: 20px; }
    .tts-wave i:nth-child(4) { height: 11px; }
    .tts-action-row { margin-top: 10px; }
    .tts-spinner { width: 24px; height: 24px; margin-bottom: 9px; border: 3px solid rgba(10,132,255,.16); border-top-color: var(--blue); border-radius: 50%; animation: tts-spin .8s linear infinite; }
    @keyframes tts-spin { to { transform: rotate(360deg); } }
    .tts-generation { display: grid; min-height: 116px; place-items: center; text-align: center; }
    .tts-status { padding: 15px; border-radius: 10px; background: var(--group); }

      z-index: 50;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(0,0,0,.34);
      backdrop-filter: blur(5px);

    .tts-modal {
      width: min(460px, calc(100vw - 48px));

      border: 1px solid rgba(0,0,0,.18);
      border-radius: 14px;
      background: var(--window);
      box-shadow: 0 24px 70px rgba(0,0,0,.34), 0 2px 10px rgba(0,0,0,.16);

    .tts-modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 18px 18px 12px; }
    .tts-modal-title { color: var(--text); font-size: 16px; font-weight: 730; letter-spacing: -.02em; }

    .tts-danger-button { min-height: 31px; padding: 0 10px; border: 0; border-radius: 7px; color: var(--red); background: rgba(255,69,58,.09); cursor: pointer; font-size: 11px; font-weight: 680; }
    .tts-confirm-delete { padding: 12px; border-radius: 9px; color: var(--text); background: rgba(255,69,58,.08); font-size: 11px; line-height: 1.45; }

      .tts-service-card { grid-template-columns: 34px minmax(0,1fr) auto; }
      .tts-service-status { display: none; }
    }

          <button class="sidebar-item" type="button" data-page="events"><span class="sidebar-icon red"><svg class="sidebar-symbol" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 13h3l1.7-6 3.1 10 1.7-5h3"></path><path d="M17 8.5c1.7.7 2.8 2 3.4 3.5-.6 1.5-1.7 2.8-3.4 3.5"></path></svg></span>事件与提示音</button>
          <button class="sidebar-item" type="button" data-page="notifications"><span class="sidebar-icon purple"><svg class="sidebar-symbol" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.2 17.4h11.6l-1.7-2.1v-3.7a4.1 4.1 0 0 0-8.2 0v3.7l-1.7 2.1z"></path><path d="M9.8 20.2h4.4"></path><path d="M12 4.2v-1"></path></svg></span>通知</button>
          <button class="sidebar-item" type="button" data-page="display"><span class="sidebar-icon purple"><svg class="sidebar-symbol" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="4.5" width="17" height="12" rx="2"></rect><path d="M9 20h6M12 16.5V20"></path></svg></span>显示</button>
          <button class="sidebar-item" type="button" data-page="sounds"><span class="sidebar-icon green"><svg class="sidebar-symbol" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 10h3l4-3v10l-4-3H4z"></path><path d="M15 9c1.7 1.3 1.7 4.7 0 6M17.5 6.5c3.4 2.8 3.4 8.2 0 11"></path></svg></span>声音</button>
          <button class="sidebar-item" type="button" data-page="usage"><span class="sidebar-icon pink"><svg class="sidebar-symbol" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 18.5h16"></path><path d="M6.5 16.5v-4M10.5 16.5V8M14.5 16.5v-2.5M18.5 16.5V5.5"></path></svg></span>用量</button>
        </div>
        <div class="sidebar-separator"></div>
        <div class="sidebar-heading">高级</div>
        <div class="sidebar-group" style="margin-top:0">
          <button class="sidebar-item" type="button" data-page="shortcuts"><span class="sidebar-icon violet"><svg class="sidebar-symbol" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5.5" width="18" height="13" rx="2.3"></rect><path d="M6.5 10h.01M9.5 10h.01M12.5 10h.01M15.5 10h.01M18 10h.01M6.5 14h.01M9.5 14h.01M12.5 14h5.5"></path></svg></span>快捷键</button>
        </div>
        <div class="sidebar-separator"></div>
        <div class="sidebar-heading">Claudio</div>
        <div class="sidebar-group" style="margin-top:0">
          <button class="sidebar-item" type="button" data-page="about"><span class="sidebar-icon blue"><svg class="sidebar-symbol" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 10.8v5.3"></path><circle class="symbol-fill" cx="12" cy="7.6" r=".8"></circle></svg></span>关于</button>
        </div>
      </nav>
      <div class="sidebar-foot"><span class="sidebar-foot-dot"></span><span id="sidebar-foot-copy">本地优先 · 无网络客户端</span></div>
    </aside>
    <main class="content"><div id="page-root" class="content-inner"></div></main>
  </div>
  <main id="panel-surface" class="panel-surface" hidden aria-label="claudi0 桌面弹窗原型"></main>
  <div id="toast" class="toast" role="status"></div>

  <script>
    /*
     * PROTOTYPE QUESTION:
     * Can a multi-AI-app manager feel like a native macOS Settings pane while
     * keeping event coverage, real receipt state, and sound rules visible?
     * Claudi0 owns the app/event/sound surface; host-product-specific controls
     * are intentionally excluded. State is in memory only.
     * This replaces the previous card-dashboard direction.
     */
    const apps = [
      { id: 'claude', name: 'Claude Code', mechanism: '原生 hooks', coverage: '5/5', state: 'ready', stateLabel: '已激活', enabled: true },
      { id: 'codex', name: 'Codex', mechanism: '原生 hooks', coverage: '4/5', state: 'ready', stateLabel: '已激活', enabled: true },
      { id: 'workbuddy', name: 'WorkBuddy', mechanism: '原生 command hooks', coverage: '2/5', state: 'waiting', stateLabel: '待回执', enabled: true }
    ];
    const eventDefinitions = [
      { id: 'task_start', name: '任务开始', code: 'UserPromptSubmit', symbol: '↗', tone: '', sound: '轻提示 · 01' },
      { id: 'stop', name: '响应结束', code: 'Stop', symbol: '✓', tone: 'green', sound: '木琴 · 02' },
      { id: 'stop_failure', name: '执行中断', code: 'StopFailure', symbol: '!', tone: 'orange', sound: '低音 · 03' },
      { id: 'notification', name: '待响应', code: 'Notification', symbol: '•', tone: 'orange', sound: '铃声 · 04' },
      { id: 'subagent_stop', name: '子任务完成', code: 'SubagentStop', symbol: '⌁', tone: 'purple', sound: '短音 · 05' }
    ];
    function buildAppEvents(overrides) {
      return eventDefinitions.map(event => ({
        ...event,
        availability: 'ready',
        coverage: '明确支持',
        enabled: true,
        ...(overrides[event.id] || {})
      }));
    }
    const eventsByApp = {
      claude: buildAppEvents({}),
      codex: buildAppEvents({
        stop_failure: { availability: 'unavailable', coverage: '未提供', enabled: false, sound: '未设置' }
      }),
      workbuddy: buildAppEvents({
        stop_failure: { availability: 'unavailable', coverage: '接口支持 · 未实现', enabled: false, sound: '未设置' },
        notification: { availability: 'partial', coverage: '部分支持 · 未实现', enabled: false, sound: '未设置' },
        subagent_stop: { availability: 'unavailable', coverage: '接口支持 · 未实现', enabled: false, sound: '未设置' }
      })
    };
    const globalSoundScope = { id: 'global', name: '全局默认', mechanism: '声音默认值', coverage: '5 个事件', state: 'ready', stateLabel: '默认', enabled: true };
    eventsByApp.global = buildAppEvents({});
    const pages = {};
    const initialQuery = new URLSearchParams(window.location.search);
    const isPanelSurface = initialQuery.get('surface') === 'panel';
    let activePage = initialQuery.get('page') || 'events';
    let selectedApp = initialQuery.get('app') || 'workbuddy';
    let panelSelectedApp = initialQuery.get('panelApp') || selectedApp;
    let toastTimer;
    const isTTSPrototype = initialQuery.get('prototype') === 'tts';
    const ttsStages = ['prompt', 'interpreting', 'generating', 'candidates', 'importing', 'applied', 'failed'];
    const ttsCandidates = [
      { id: 'A', name: '清晰', duration: '1.2 秒' },
      { id: 'B', name: '轻快', duration: '1.4 秒' },
      { id: 'C', name: '克制', duration: '1.6 秒' }
    ];
    const ttsBindings = {
      task_start: { file: 'light-01.aiff', label: '轻提示 · 01' },
      stop: { file: 'xylophone-02.aiff', label: '木琴 · 02' }
    };
    const initialTTSStageKey = initialQuery.get('stage') || 'prompt';
    const initialTTSStage = ttsStages.includes(initialTTSStageKey) ? initialTTSStageKey : 'prompt';
    const initialTTSCredentialValue = initialQuery.get('credential');
    const initialTTSCredentialReady = initialTTSCredentialValue
      ? initialTTSCredentialValue === 'ready'
      : initialTTSStage !== 'prompt';
    let ttsTransitionTimer;
    let ttsCredentialState = {
      ready: initialTTSCredentialReady,
      modalOpen: false,
      confirmDelete: false
    };

    function ttsDefaultsForEvent(eventId) {
      if (eventId === 'task_start') {
        return {
          cueName: '轻铃开始处理',
          prompt: '先响一声轻铃，再轻声说“开始处理”',
          soundPlan: {
            soundDescription: '轻铃一声后，轻声说出指定台词',
            spokenContent: '开始处理',
            language: '简体中文',
            styleDescription: '轻柔、清晰',
            targetDuration: '2 秒以内'
          }
        };
      }
      return {
        cueName: '小猫两声',
        prompt: '一只小猫短促地叫两声，第二声稍高，不要背景音乐',
        soundPlan: {
          soundDescription: '小猫短促叫两声，第二声稍高',
          spokenContent: null,
          language: null,
          styleDescription: '自然、干净',
          targetDuration: '约 1.5 秒'
        }
      };
    }

    function makeTTSState(stage = 'prompt', eventId = 'stop') {
      const defaults = ttsDefaultsForEvent(eventId);
      const hasConfirmedPlan = ['generating', 'candidates', 'importing', 'applied', 'failed'].includes(stage);
      return {
        stage,
        eventId,
        cueName: defaults.cueName,
        cueNameIsManual: false,
        nameError: '',
        prompt: defaults.prompt,
        promptError: '',
        soundPlan: { ...defaults.soundPlan },
        confirmedSoundPlan: hasConfirmedPlan ? { ...defaults.soundPlan } : null,
        selectedCandidate: ['importing', 'applied'].includes(stage) ? 'B' : null,
        playing: null,
        inlineOpen: true
      };
    }

    let ttsState = makeTTSState(initialTTSStage);
    if (isTTSPrototype && initialTTSStage === 'applied') {
      ttsBindings.stop = { file: 'cue-stop-b.aiff', label: '小猫两声' };
      eventsByApp.workbuddy.find(item => item.id === 'stop').sound = ttsBindings.stop.label;
    }

    function status(state, label) { return `<span class="status ${state}"><span class="status-dot"></span>${label}</span>`; }
    function appStatus(app) { return app.enabled ? status(app.state, app.stateLabel) : status('unavailable', '已停用'); }
    function appById(id) { return apps.find(app => app.id === id) || apps[0]; }
    function panelAppById(id) { return id === 'global' ? globalSoundScope : appById(id); }
    function eventsForApp(id) { return eventsByApp[id] || eventsByApp.claude; }
    function eventById(appId, eventId) { return eventsForApp(appId).find(event => event.id === eventId); }

    const panelEventKinds = {
      task_start: 'task',
      stop: 'complete',
      stop_failure: 'interrupted',
      notification: 'response',
      subagent_stop: 'subtask'
    };
    const panelEventIcons = {
      task: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m3 11 18-8-7 18-3-7-8-3Z" fill="currentColor"/><path d="m11 14 10-11" stroke="#d9eaff" stroke-width="1.2" opacity=".82"/></svg>',
      complete: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="currentColor"/><path d="m8 12 2.6 2.7L16.7 9" stroke="#122318" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      interrupted: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"/><rect x="8" y="7" width="3" height="10" rx="1" fill="#38280d"/><rect x="13" y="7" width="3" height="10" rx="1" fill="#38280d"/></svg>',
      response: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 17h12l-1.2-2.2v-4.6a4.8 4.8 0 0 0-9.6 0v4.6L6 17Z" fill="currentColor"/><path d="M10 19h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="17.5" cy="7" r="2.3" fill="currentColor"/></svg>',
      subtask: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="m8 12 2.5 2.7L16.5 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    };
    const panelPlayIcon = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m7 4 13 8-13 8V4Z"/></svg>';
    const panelSpeakerIcon = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4V9Z" fill="currentColor"/><path d="M16 9.5c1.5 1.4 1.5 3.6 0 5M18.5 7c3 2.7 3 7.3 0 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
    const panelMutedIcon = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 9h4l5-4v6.2M12 16v3l-5-4H3V9" fill="currentColor"/><path d="m5 4 15 16M17 10c.8 1.1.8 2.4.2 3.5M19 7.5c2.1 2.4 2.3 5.7.8 8.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    const panelPowerIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 2v10"/><path d="M18.36 5.64a9 9 0 1 1-12.72 0"/></svg>';

    function panelEventStateClass(event) { return event.availability === 'ready' ? '' : event.availability; }
    function panelEventKind(event) { return panelEventKinds[event.id] || 'task'; }
    function panelRenderEvent(event, app) {
      const kind = panelEventKind(event);
      const unavailable = event.availability !== 'ready';
      const soundMissing = event.sound === '未设置';
      const stateText = event.coverage;
      return `<article class="panel-event-row ${!event.enabled ? 'is-disabled' : ''}">
        <span class="panel-event-icon ${kind}" aria-hidden="true">${panelEventIcons[kind]}</span>
        <div class="panel-event-copy">
          <div class="panel-event-title">${event.name}</div>
          <div class="panel-event-meta"><code class="panel-event-code">${event.code}</code><span class="panel-event-state ${panelEventStateClass(event)}">${stateText}</span><span class="panel-event-sound ${soundMissing ? 'is-empty' : ''}">${event.sound}</span></div>
        </div>
        <div class="panel-event-actions">
          <button class="panel-icon-button" type="button" data-panel-action="play" data-panel-event="${event.id}" data-panel-app="${app.id}" aria-label="试听 ${event.name}" ${soundMissing ? 'disabled' : ''}>${panelPlayIcon}</button>
          <button class="panel-icon-button ${event.enabled ? '' : 'muted'}" type="button" data-panel-action="mute" data-panel-event="${event.id}" data-panel-app="${app.id}" aria-pressed="${event.enabled ? 'false' : 'true'}" aria-label="${event.enabled ? '静音' : '取消静音'} ${event.name}" ${unavailable ? 'disabled' : ''}>${event.enabled ? panelSpeakerIcon : panelMutedIcon}</button>
        </div>
      </article>`;
    }

    function panelMarkup() {
      const app = panelAppById(panelSelectedApp);
      const appEvents = eventsForApp(app.id);
      return `<div class="panel-content">
        <header class="panel-topbar">
          <div class="panel-wordmark" aria-label="claudi0">claudi<img src="../assets/branding/claudi0-mark.svg" alt="0"></div>
          <button class="panel-interface-button" type="button" data-panel-action="language" aria-label="界面语言">Aa⌄</button>
        </header>
        <section class="panel-heading" aria-labelledby="panel-pack-name"><h1 id="panel-pack-name">皮卡丘</h1><p class="panel-summary">${apps.length} 个已发布来源 · ${eventDefinitions.length} 个声音事件</p></section>
        <section class="panel-section" aria-labelledby="panel-scope-title">
          <div class="panel-section-title-row"><h2 class="panel-section-title" id="panel-scope-title">声音作用域</h2><span class="panel-section-caption">缺失字段继承全局默认</span></div>
          <div class="panel-scope-wrap">
            <button class="panel-scope-button" type="button" data-panel-scope-toggle aria-expanded="false" aria-controls="panel-app-menu">
              <span class="panel-scope-copy"><span class="panel-scope-name">${app.name}</span><span class="panel-scope-detail">${app.coverage} · ${app.stateLabel}</span></span>
              ${appStatus(app)}<span class="panel-chevron" aria-hidden="true">⌄</span>
            </button>
            <div id="panel-app-menu" class="panel-scope-menu" hidden>${[globalSoundScope, ...apps].map(item => `<button class="panel-app-option ${item.id === app.id ? 'active' : ''}" type="button" data-panel-app="${item.id}"><span class="panel-app-option-copy"><span class="panel-app-option-name">${item.name}</span><span class="panel-app-option-meta">${item.coverage} · ${item.stateLabel}</span></span>${appStatus(item)}</button>`).join('')}</div>
          </div>
        </section>
        <section class="panel-section" aria-labelledby="panel-events-title">
          <div class="panel-section-title-row"><h2 class="panel-section-title" id="panel-events-title">${app.name} · 事件</h2><span class="panel-section-caption">${app.coverage} 可映射</span></div>
          <div class="panel-event-list">${appEvents.map(event => panelRenderEvent(event, app)).join('')}</div>
        </section>
        <section class="panel-controls" aria-label="播放设置">
          <div class="panel-control-row"><div class="panel-control-copy"><strong>主音量</strong><small>全局音量；事件开关仍按当前 app 独立保存。</small></div><div class="panel-range"><input type="range" min="0" max="100" value="68" data-panel-range aria-label="主音量"><output data-panel-range-value>68%</output></div></div>
          <div class="panel-control-row"><div class="panel-control-copy"><strong>声音包 · 皮卡丘</strong><small>${app.id === 'global' ? '全局默认' : `${app.name} 稀疏覆盖`} · 在「声音」中管理资源。</small></div><div><button class="panel-control-action" type="button" data-panel-action="open-settings">打开设置</button>${app.id === 'global' ? '' : '<button class="panel-control-action" type="button" data-panel-action="reset-surface">重置为全局</button>'}</div></div>
        </section>
      </div>
      <footer class="panel-footer"><button class="panel-close" type="button" data-panel-action="close" aria-label="关闭 claudi0">${panelPowerIcon}<span>关闭</span></button></footer>`;
    }

    function renderPanel() {
      const surface = document.querySelector('#panel-surface');
      if (!surface) return;
      surface.innerHTML = panelMarkup();
      surface.hidden = false;
      try { const url = new URL(window.location.href); url.searchParams.set('surface', 'panel'); url.searchParams.set('panelApp', panelSelectedApp); window.history.replaceState({}, '', url); } catch (_) {}
    }

    pages.general = () => `<header class="page-header"><div><h1>通用</h1><p>Claudio 的启动和界面行为。</p></div><span class="demo-label">原生风格原型</span></header>
      <div class="section-label">系统</div><section class="settings-group">
        <div class="settings-row"><div class="row-title">登录时打开</div><div class="row-control"><button class="toggle" type="button" data-toggle="登录时打开" aria-pressed="false"></button></div></div>
        <div class="settings-row"><div class="row-title">App 语言</div><div class="row-control"><select class="native-select" aria-label="App 语言"><option>跟随系统</option><option>简体中文</option><option>English</option></select></div></div>
      </section>
      <div class="section-label" style="margin-top:34px">显示</div><section class="settings-group">
        <div class="settings-row"><div class="row-title">全屏时隐藏</div><div class="row-control"><button class="toggle blue on" type="button" data-toggle="全屏时隐藏" aria-pressed="true"></button></div></div>
        <div class="settings-row tall"><div><div class="row-title">空闲时自动隐藏</div><div class="row-caption">没有 Agent 工作满 30 秒后隐藏；有新活动时重新显示。</div></div><div class="row-control"><button class="toggle" type="button" data-toggle="空闲时自动隐藏" aria-pressed="false"></button></div></div>
      </section>`;

    pages.apps = () => {
      const app = appById(selectedApp);
      const connectionDescription = app.state === 'ready' ? '当前安装实例已取得真实宿主事件回执。' : '当前安装实例已配置，等待真实宿主事件回执。';
      return `<header class="page-header"><div><h1>集成</h1><p>管理 Claudio 连接的应用、连接方式和事件能力。</p></div><div class="page-header-actions"><span class="demo-label">演示数据</span></div></header>
        <div class="section-label">Agent</div>
        <section class="app-list">${apps.map(item => `<div class="app-row ${item.id === selectedApp ? 'selected' : ''}"><button class="app-row-select" type="button" data-app="${item.id}"><span class="app-name">${item.name}</span></button>${appStatus(item)}<span class="app-coverage">${item.coverage}</span><button class="toggle blue app-connect-toggle ${item.enabled ? 'on' : ''}" type="button" data-app-toggle="${item.id}" aria-pressed="${item.enabled ? 'true' : 'false'}" aria-label="${item.enabled ? '停用' : '启用'} ${item.name}"></button></div>`).join('')}</section>
        <p class="app-hint">管理 Claudio 与每个应用的连接方式。事件开关和提示音仍在「事件与提示音」中按 app 独立保存。</p>
        <div class="section-label" style="margin-top:30px">${app.name} · 连接</div>
        <section class="settings-group">
          <div class="settings-row tall"><div><div class="row-title">连接状态</div><div class="row-caption">${connectionDescription}</div></div><div class="row-control">${appStatus(app)}<button class="plain-button" type="button" data-action="refresh">重新检测</button></div></div>
          <div class="settings-row"><div><div class="row-title">接入方式</div><div class="row-caption">${app.mechanism} · 只处理事件标识和播放结果，不读取提示词或响应正文</div></div><div class="row-control"><span class="row-value">${app.coverage}</span></div></div>
          <div class="settings-row"><div><div class="row-title">事件与提示音</div><div class="row-caption">只修改 ${app.name}；其他 app 的事件开关和声音保持不变</div></div><div class="row-control"><button class="plain-button" type="button" data-page-target="events" data-app-target="${app.id}">管理事件</button></div></div>
          <div class="settings-row"><div><div class="row-title">脱敏回执历史</div><div class="row-caption">每个来源最多保留 20 条、30 天；清除不影响当前连接或声音偏好</div></div><div class="row-control"><button class="plain-button" type="button" data-action="clear-receipts">清除历史…</button></div></div>
        </section>
        <div class="info-callout"><span class="info-icon">i</span><span>“已配置”不等于“已激活”：只有当前安装实例产生真实 receipt，状态才会变为已激活。普通 Chat 不继承 Codex view 的 hooks。</span></div>`;
    };

    function ttsEscape(value) {
      return String(value ?? '').replace(/[&<>"]/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
      })[character]);
    }

    function currentTTSEvent() {
      return eventById('workbuddy', ttsState.eventId) || eventById('workbuddy', 'stop');
    }

    function currentTTSBinding() {
      return ttsBindings[ttsState.eventId] || { file: 'unbound.aiff', label: '未设置' };
    }

    function ttsWave() {
      return '<span class="tts-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>';
    }

    function syncTTSURL() {
      if (!isTTSPrototype) return;
      try {
        const url = new URL(window.location.href);
        url.searchParams.set('prototype', 'tts');
        url.searchParams.delete('variant');
        url.searchParams.set('stage', ttsState.stage);
        url.searchParams.set('credential', ttsCredentialState.ready ? 'ready' : 'missing');
        url.searchParams.set('page', 'events');
        url.searchParams.set('app', 'workbuddy');
        window.history.replaceState({}, '', url);
      } catch (_) {}
    }

    function ttsDurationFromPrompt(prompt, fallback) {
      const duration = prompt.match(/(\d+(?:\.\d+)?)\s*秒\s*(以内|内)?/);
      if (!duration) return fallback;
      return `${duration[1]} 秒${duration[2] ? '以内' : ''}`;
    }

    function ttsLanguageForText(text) {
      return /[\u3400-\u9fff]/.test(text) ? '简体中文' : 'English';
    }

    function interpretTTSPrompt(prompt) {
      const quoted = prompt.match(/[“\"]([^”\"]+)[”\"]/);
      const spokenContent = quoted?.[1]?.trim() || null;
      if (/小猫|猫叫/.test(prompt)) {
        return {
          soundDescription: '小猫短促叫两声，第二声稍高',
          spokenContent: null,
          language: null,
          styleDescription: '自然、干净',
          targetDuration: ttsDurationFromPrompt(prompt, '约 1.5 秒')
        };
      }
      if (/木质|敲击/.test(prompt)) {
        return {
          soundDescription: '清脆的木质敲击两下',
          spokenContent: null,
          language: null,
          styleDescription: '清脆、干净',
          targetDuration: ttsDurationFromPrompt(prompt, '1 秒以内')
        };
      }
      if (spokenContent && /铃/.test(prompt)) {
        return {
          soundDescription: '轻铃一声后，轻声说出指定台词',
          spokenContent,
          language: ttsLanguageForText(spokenContent),
          styleDescription: '轻柔、清晰',
          targetDuration: ttsDurationFromPrompt(prompt, '2 秒以内')
        };
      }
      if (spokenContent) {
        const tones = ['温和', '克制', '清晰', '轻快', '轻声'].filter(tone => prompt.includes(tone));
        const voice = prompt.includes('女声') ? '女声' : prompt.includes('男声') ? '男声' : '人声';
        const styleDescription = tones.length ? tones.join('、') : '自然、清晰';
        return {
          soundDescription: `${styleDescription}的${voice}说出指定台词`,
          spokenContent,
          language: ttsLanguageForText(spokenContent),
          styleDescription,
          targetDuration: ttsDurationFromPrompt(prompt, '2 秒以内')
        };
      }
      return {
        soundDescription: prompt.replace(/[，,]?\s*\d+(?:\.\d+)?\s*秒\s*(?:以内|内)?/g, '').trim(),
        spokenContent: null,
        language: null,
        styleDescription: '自然、干净',
        targetDuration: ttsDurationFromPrompt(prompt, '约 1.5 秒')
      };
    }

    function normalizeTTSSoundPlan(plan, prompt) {
      const soundDescription = String(plan.soundDescription || '').trim() || prompt.trim();
      const spokenContent = String(plan.spokenContent || '').trim() || null;
      const styleDescription = String(plan.styleDescription || '').trim() || '自然、干净';
      const rawDuration = String(plan.targetDuration || '约 1.5 秒');
      const durationMatch = rawDuration.match(/(\d+(?:\.\d+)?)\s*秒/);
      const durationSeconds = durationMatch
        ? Math.min(3, Math.max(0.5, Number(durationMatch[1])))
        : 1.5;
      const durationLabel = Number.isInteger(durationSeconds)
        ? String(durationSeconds)
        : durationSeconds.toFixed(1);
      return {
        soundDescription,
        spokenContent,
        language: spokenContent ? plan.language || ttsLanguageForText(spokenContent) : null,
        styleDescription,
        targetDuration: rawDuration.includes('约')
          ? `约 ${durationLabel} 秒`
          : `${durationLabel} 秒以内`
      };
    }

    function suggestedTTSCueName(prompt, plan) {
      const spokenContent = String(plan.spokenContent || '').trim();
      if (/小猫|猫叫/.test(prompt)) return '小猫两声';
      if (/木质|敲击/.test(prompt)) return '木质双击';
      if (spokenContent && /铃/.test(prompt)) return `轻铃${spokenContent}`.slice(0, 24);
      if (spokenContent) return spokenContent.slice(0, 24);
      const compact = String(plan.soundDescription || prompt)
        .replace(/[，。,.!?！？；;：“”\"']/g, '')
        .replace(/\s+/g, '')
        .trim();
      return compact.slice(0, 24) || '我的 AI 提示音';
    }

    function validateTTSCueName(value) {
      const name = String(value || '').trim();
      if (!name) return '请先为最终提示音命名。';
      if (name.length > 40) return '提示音名称最多 40 个字符。';
      if (/[\u0000-\u001f\u007f]/.test(name)) return '提示音名称不能包含控制字符。';
      return '';
    }

    function activeTTSSoundPlan() {
      return ttsState.confirmedSoundPlan || ttsState.soundPlan;
    }

    function renderTTSSteps() {
      const current = ttsState.stage === 'prompt' ? 0 : 1;
      const steps = [
        ['prompt', '描述'],
        ['candidates', '试听并命名']
      ];
      return `<div class="tts-steps" aria-label="生成步骤">${steps.map(([id, label], index) => {
        const stateClass = index < current ? 'done' : index === current ? 'active' : '';
        return `<span class="tts-step ${stateClass}"><span class="tts-step-number">${index < current ? '✓' : index + 1}</span>${label}</span>`;
      }).join('')}</div>`;
    }

    function renderTTSServiceCard() {
      const ready = ttsCredentialState.ready;
      return `<section class="tts-service-card" aria-label="AI 声音生成服务">
        <span class="tts-service-icon" aria-hidden="true">⌁</span>
        <span class="tts-service-copy"><span class="tts-service-title">AI 声音生成服务 · 自备 API Key</span><span class="tts-service-meta">${ready ? '已存入 macOS 钥匙串；生成时由本机直连固定的首发服务' : '首次生成前配置一次；不会写入设置文件、日志或提示音 manifest'}</span></span>
        <span class="tts-service-status ${ready ? 'ready' : ''}">${ready ? '已配置' : '未配置'}</span>
        <button class="tts-secondary-button" type="button" data-tts-action="manage-credential">${ready ? '管理' : '配置 API Key'}</button>
      </section>`;
    }

    function renderTTSCredentialModal() {
      if (!ttsCredentialState.modalOpen) return '';
      if (ttsCredentialState.confirmDelete) {
        return `<div class="tts-modal-backdrop"><section class="tts-modal" role="dialog" aria-modal="true" aria-labelledby="tts-key-title">
          <div class="tts-modal-head"><div><div id="tts-key-title" class="tts-modal-title">删除 API Key？</div><div class="tts-modal-copy">删除后不能继续生成新候选；已经采用并保存的提示音不会受影响。</div></div><button class="tts-modal-close" type="button" data-tts-action="close-credential" aria-label="关闭">×</button></div>
          <div class="tts-modal-body"><div class="tts-confirm-delete">正式版会从 macOS 钥匙串删除该凭据，并立即让后续生成失败关闭；不会删除现有提示音。</div></div>
          <div class="tts-modal-actions"><button class="tts-secondary-button" type="button" data-tts-action="cancel-delete-credential">取消</button><button class="tts-danger-button" type="button" data-tts-action="confirm-delete-credential">确认删除</button></div>
        </section></div>`;
      }
      const configured = ttsCredentialState.ready;
      return `<div class="tts-modal-backdrop"><section class="tts-modal" role="dialog" aria-modal="true" aria-labelledby="tts-key-title">
        <div class="tts-modal-head"><div><div id="tts-key-title" class="tts-modal-title">${configured ? '管理 API Key' : '连接 AI 声音生成服务'}</div><div class="tts-modal-copy">首版固定使用一个 Claudio 支持的生成服务，只需要配置自己的 API Key。</div></div><button class="tts-modal-close" type="button" data-tts-action="close-credential" aria-label="关闭">×</button></div>
        <div class="tts-modal-body">
          <div class="tts-provider-row"><span><span class="tts-provider-label">生成服务</span><span class="tts-service-meta" style="display:block">不允许自定义 API 地址</span></span><span class="tts-provider-value">首发声音生成服务</span></div>
          <label><span class="tts-prompt-label">${configured ? '输入新的 API Key 以替换' : 'API Key'}</span><input id="tts-api-key-input" class="tts-secret-input" type="password" autocomplete="new-password" spellcheck="false" placeholder="原型中输入任意 8 位演示字符"></label>
          <span id="tts-api-key-error" class="tts-error" role="alert"></span>
          <div class="tts-modal-note">正式版中，明文只在验证与钥匙串写入期间短暂存在；view model、日志、配置文件和提示音 manifest 都拿不到它。本原型不会联网或保存，请勿输入真实 Key。</div>
        </div>
        <div class="tts-modal-actions">${configured ? '<button class="tts-danger-button" type="button" data-tts-action="delete-credential">删除 API Key</button>' : '<span></span>'}<span style="display:flex;gap:7px"><button class="tts-secondary-button" type="button" data-tts-action="close-credential">取消</button><button class="tts-primary-button" type="button" data-tts-action="save-credential">${configured ? '验证并替换' : '验证并保存'}</button></span></div>
      </section></div>`;
    }

    function renderTTSPrompt() {
      return `<section class="tts-card">
        <label class="tts-prompt-label" for="tts-prompt-input">声音描述 · 可以是语音、动物叫声、音效或混合声音</label>
        <textarea id="tts-prompt-input" class="tts-prompt" data-tts-field="prompt" placeholder="例如：一只小猫短促地叫两声，第二声稍高，不要背景音乐">${ttsEscape(ttsState.prompt)}</textarea>
        <div class="tts-prompt-actions"><span class="tts-error">${ttsEscape(ttsState.promptError)}</span><button class="tts-primary-button" type="button" data-tts-action="generate">生成 3 个候选</button></div>
        <div class="tts-helper">先专注描述想听到的声音；下一步试听候选并确认提示音名称。后台会隐藏解释并检查描述。</div>
      </section>`;
    }

    function renderTTSRequestSummary() {
      const hasNameError = Boolean(ttsState.nameError);
      return `<section class="tts-request-summary">
        <div class="tts-name-row"><label class="tts-name-field" for="tts-final-name"><span class="tts-prompt-label">提示音名称</span><input id="tts-final-name" class="tts-name-input" type="text" maxlength="40" required data-tts-field="final-name" value="${ttsEscape(ttsState.cueName)}" aria-invalid="${hasNameError}" aria-describedby="tts-final-name-help tts-final-name-error"></label><span class="tts-name-hint">采用候选时保存到「我的提示音」</span></div>
        <div class="tts-name-support"><span id="tts-final-name-help" class="tts-helper">系统已根据描述提供建议；可直接修改，改名不会重新生成。</span><span id="tts-final-name-error" class="tts-error" role="alert">${ttsEscape(ttsState.nameError)}</span></div>
        <div class="tts-summary-description"><span class="tts-summary-line"><strong>你的描述</strong><span class="tts-summary-value">${ttsEscape(ttsState.prompt)}</span></span><button class="tts-link-button" type="button" data-tts-action="edit-prompt">修改描述</button></div>
      </section>`;
    }

    function renderTTSPlayButton(candidate) {
      const playing = ttsState.playing === candidate.id;
      return `<button class="tts-icon-button ${playing ? 'playing' : ''}" type="button" data-tts-action="play-candidate" data-tts-candidate="${candidate.id}" aria-label="${playing ? '停止' : '试听'}候选 ${candidate.id}">${playing ? '■' : '▶'}</button>`;
    }

    function renderTTSCandidates() {
      const rows = ttsCandidates.map(candidate => `<div class="tts-candidate-row">
        ${renderTTSPlayButton(candidate)}
        <span><span class="tts-candidate-name">${candidate.id} · ${candidate.name}</span><span class="tts-candidate-meta"><span class="tts-sim-badge">BYOK 原型候选</span> · ${candidate.duration}</span></span>
        ${ttsWave()}
        <button class="tts-small-button" type="button" data-tts-action="adopt" data-tts-candidate="${candidate.id}">采用并保存</button>
      </div>`).join('');
      return `${renderTTSRequestSummary()}<div class="tts-candidate-list">${rows}</div>
        <div class="tts-action-row"><span class="tts-helper">不自动播放 · 同时最多试听一个 · 采用前先停止试听</span><span style="display:flex;align-items:center;gap:6px"><button class="tts-link-button" type="button" data-tts-action="simulate-failure">预览失败态</button><button class="tts-secondary-button" type="button" data-tts-action="regenerate">重新生成</button></span></div>`;
    }

    function renderTTSGeneration() {
      const interpreting = ttsState.stage === 'interpreting';
      const title = interpreting ? '正在理解你的声音描述…' : '正在请求声音生成服务…';
      const helper = interpreting
        ? '后台会识别语音、动物叫声、音效或混合声音，并自动补齐生成所需参数；名称将在候选生成后建议。'
        : '正式版由本机读取钥匙串并直连服务；原型只模拟请求，不会使用真实 API Key。';
      return `<section class="tts-card tts-generation"><div><span class="tts-spinner" style="display:inline-block"></span><div class="tts-card-title">${title}</div><div class="tts-helper" style="margin-top:5px">${helper}</div></div></section>`;
    }

    function renderTTSStatus() {
      const binding = currentTTSBinding();
      if (ttsState.stage === 'importing') {
        return `<section class="tts-card tts-generation"><div><span class="tts-spinner" style="display:inline-block"></span><div class="tts-card-title">正在安全采用候选 ${ttsState.selectedCandidate}…</div><div class="tts-helper" style="margin-top:5px">停止试听 → AudioImport 校验 → manifest bind；完成前仍使用 ${ttsEscape(binding.label)}。</div></div></section>`;
      }
      if (ttsState.stage === 'applied') {
        return `<section class="tts-status success"><div class="tts-status-line"><span class="tts-status-symbol">✓</span><span style="flex:1"><span class="tts-card-title">“${ttsEscape(binding.label)}”已用于“${ttsEscape(currentTTSEvent().name)}”</span><span class="tts-helper" style="display:block;margin-top:4px">已保存到「我的提示音」；${ttsEscape(binding.file)} 已通过 AudioImport 并写入 manifest，另外两个临时候选已清理。</span></span></div><div class="tts-action-row"><span class="tts-helper">旧绑定只有在完整采用成功后才被替换。</span><button class="tts-secondary-button" type="button" data-tts-action="reset">再生成一次</button></div></section>`;
      }
      return `<section class="tts-status failure"><div class="tts-status-line"><span class="tts-status-symbol">!</span><span style="flex:1"><span class="tts-card-title">AudioImport · 时长校验失败</span><span class="tts-helper" style="display:block;margin-top:4px">候选没有写入 manifest；“${ttsEscape(currentTTSEvent().name)}”仍在使用 ${ttsEscape(binding.label)}（${ttsEscape(binding.file)}）。</span></span></div><div class="tts-action-row"><span class="tts-helper">失败不会产生假刷新，也不会改动其他 app。</span><button class="tts-secondary-button" type="button" data-tts-action="retry">返回候选</button></div></section>`;
    }

    function renderTTSFlow() {
      if (ttsState.stage === 'prompt') return `${renderTTSSteps()}${renderTTSPrompt()}`;
      if (['interpreting', 'generating'].includes(ttsState.stage)) return `${renderTTSSteps()}${renderTTSGeneration()}`;
      if (['importing', 'applied', 'failed'].includes(ttsState.stage)) return `${renderTTSSteps()}${renderTTSStatus()}`;
      return `${renderTTSSteps()}${renderTTSCandidates()}`;
    }

    function renderTTSInline() {
      const event = currentTTSEvent();
      return `<div class="tts-inline">
        <div class="tts-inline-head"><div><div class="tts-inline-title">✦ 为“${ttsEscape(event.name)}”生成 AI 提示音</div><div class="tts-inline-meta">语音、动物叫声、音效或混合声音 · 保存到「我的提示音」</div></div><button class="tts-link-button" type="button" data-tts-action="collapse-inline">收起</button></div>
        ${renderTTSFlow()}
      </div>`;
    }

    function renderTTSEventRow(event, app) {
      const available = event.availability === 'ready';
      const selected = ttsState.eventId === event.id && available;
      const binding = ttsBindings[event.id];

      const soundActions = available
        ? `<span class="tts-sound-actions"><button class="plain-button" type="button" data-action="play" data-event="${event.id}" data-app-id="${app.id}">${ttsEscape(soundLabel)}</button><button class="tts-create-button" type="button" data-tts-action="open-event" data-tts-event="${event.id}">✦ 描述生成</button></span>`
        : `<span class="tts-sound-actions"><button class="plain-button" type="button" disabled>${ttsEscape(event.sound)}</button><button class="tts-create-button" type="button" disabled>不可生成</button></span>`;
      return `<div class="event-row scoped tts-event-row ${selected ? 'selected' : ''}"><span class="event-symbol ${event.tone}">${event.symbol}</span><span><span class="event-name">${event.name}</span><span class="event-code">${event.code}</span></span><span class="event-coverage">${status(event.availability, event.coverage)}</span><button class="toggle event-toggle ${event.enabled ? 'on' : ''}" type="button" data-event-toggle="${event.id}" data-event-app-id="${app.id}" aria-pressed="${event.enabled ? 'true' : 'false'}" aria-label="${event.enabled ? '关闭' : '开启'} ${event.name}" ${available ? '' : 'disabled'}></button>${soundActions}</div>${selected && ttsState.inlineOpen ? renderTTSInline() : ''}`;
    }

    function renderTTSPage(app, appEvents) {
      return `<header class="page-header"><div><h1>事件与提示音</h1><p>按 app 单独管理事件映射、启用状态和声音选择；在明确支持的事件上，可用自然语言生成不超过 3 秒的 AI 提示音。</p></div><div class="page-header-actions"><span class="tts-prototype-tag">AI 提示音核心闭环原型</span><button class="plain-button" type="button" data-action="play-all">试听全部</button></div></header>
        ${renderTTSServiceCard()}
        <div class="event-layout">
          <aside class="event-app-nav" aria-label="选择管理对象">
            <div class="event-app-nav-head"><div><div class="scope-eyebrow">管理对象</div><div class="event-app-nav-title">集成</div></div><span class="event-app-count">${apps.length} 个已接入</span></div>
            <div class="event-app-picker" role="listbox" aria-label="集成列表">${apps.map(item => `<button class="event-app-option ${item.id === app.id ? 'active' : ''}" type="button" role="option" aria-selected="${item.id === app.id ? 'true' : 'false'}" data-event-app="${item.id}"><span class="event-app-option-head"><span class="app-name">${item.name}</span><span class="app-coverage">${item.coverage}</span></span><span class="event-app-option-foot">${appStatus(item)}<span class="app-coverage">查看事件</span></span></button>`).join('')}</div>
            <div class="event-app-nav-foot">AI 生成只作用于右侧当前 app 的所选事件；其他 app 与未选事件保持不变。</div>
