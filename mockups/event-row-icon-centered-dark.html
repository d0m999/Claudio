<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claudio — 事件图标整体居中 Mockup</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #0f0f0e;
      --panel: #191816;
      --surface: #24211e;
      --surface-soft: #211e1c;
      --line: #47423e;
      --text: #f0ece5;
      --secondary: #b7b1a8;
      --tertiary: #8d877f;
      --clay: #e37e5d;
      --green: #36d465;
      --blue: #2387f3;
      --amber: #ffa200;
      --indigo: #6567ed;
      --icon-blue: #192d48;
      --icon-green: #183d25;
      --icon-amber: #3c2c16;
      --icon-clay: #3b2823;
      --icon-indigo: #292742;
      --focus: #82b8ff;
    }

    * { box-sizing: border-box; }

    html,
    body { min-height: 100%; }

    body {
      margin: 0;
      padding: 28px;
      display: grid;
      place-items: start center;
      background:
        radial-gradient(circle at 50% -10%, #2a2824 0, transparent 35%),
        var(--canvas);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "PingFang SC", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input { font: inherit; }

    .panel {
      width: min(624px, calc(100vw - 32px));
      padding: 22px 27px 30px;
      overflow: hidden;
      border: 2px solid #6b6862;
      border-radius: 31px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, .018), transparent 42%),
        var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .54);
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      height: 43px;
      font-size: 35px;
      font-weight: 730;
      letter-spacing: -2.3px;
      line-height: 1;
    }

    .wordmark img {
      width: 52px;
      height: 52px;
      margin-left: -7px;
    }

    .language-button {
      min-width: 104px;
      height: 54px;
      border: 0;
      border-radius: 13px;
      color: var(--clay);
      background: #211c18;
      font-size: 28px;
      font-weight: 720;
      cursor: pointer;
    }

    .language-button:hover { background: #2a211c; }

    .language-button:focus-visible,
    .icon-button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .panel-heading { margin-top: 9px; }

    h1,
    h2,
    h3,
    p { margin: 0; }

    h1 {
      font-size: 27px;
      line-height: 1.2;
      letter-spacing: -.7px;
    }

    .audible-count {
      margin-top: 6px;
      color: var(--secondary);
      font-size: 21px;
      font-weight: 590;
    }

    .host-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 24px;
    }

    .host-card {
      min-height: 136px;
      padding: 15px 15px 13px;
      border: 2px solid var(--line);
      border-radius: 24px;
      background: rgba(36, 33, 30, .72);
    }

    .host-card-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .host-status {
      display: grid;
      place-items: center;
      width: 21px;
      height: 21px;
      flex: 0 0 21px;
      border-radius: 50%;
      color: #161713;
      font-size: 14px;
      font-weight: 900;
    }

    .host-status.pending { color: #24211e; background: #c4c2bc; }
    .host-status.ready { background: var(--green); }

    .host-name {
      font-size: 22px;
      font-weight: 720;
      letter-spacing: -.35px;
      white-space: nowrap;
    }

    .host-readiness {
      margin-top: 11px;
      color: var(--secondary);
      font-size: 19px;
      font-weight: 670;
    }

    .host-detail {
      margin-top: 5px;
      color: var(--secondary);
      font-size: 17px;
      font-weight: 520;
      line-height: 1.28;
    }

    .section-title {
      margin-top: 23px;
      color: var(--secondary);
      font-size: 20px;
      font-weight: 720;
      letter-spacing: -.1px;
    }

    .event-list { margin-top: 4px; }

    /*
      核心关系：整行只有三列。图标与操作区都对中间的完整文案组居中，
      而不是分别对齐事件名或标签行。
    */
    .event-row {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 12px;
      min-height: 112px;
      padding: 13px 0;
    }

    .event-icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      align-self: center;
      border-radius: 13px;
    }

    .event-icon svg { width: 30px; height: 30px; }
    .event-icon.task { color: var(--blue); background: var(--icon-blue); }
    .event-icon.complete { color: var(--green); background: var(--icon-green); }
    .event-icon.interrupted { color: var(--amber); background: var(--icon-amber); }
    .event-icon.response { color: var(--clay); background: var(--icon-clay); }
    .event-icon.subtask { color: var(--indigo); background: var(--icon-indigo); }

    .row-copy {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 10px;
    }

    .event-title {
      font-size: 25px;
      font-weight: 710;
      line-height: 1.08;
      letter-spacing: -.55px;
    }

    .chips {
      display: flex;
      min-width: 0;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 38px;
      padding: 6px 11px;
      border: 2px solid var(--line);
      border-radius: 12px;
      color: var(--secondary);
      background: rgba(255, 255, 255, .018);
      font-size: 19px;
      font-weight: 680;
      line-height: 1;
      white-space: nowrap;
    }

    .chip.host.connected {
      border-color: transparent;
      background: #293229;
    }

    .chip.host.disconnected {
      border-color: #aaa79f;
      background: transparent;
    }

    .chip.coverage { padding-inline: 12px; }

    .host-icon {
      display: block;
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      background: currentColor;
      -webkit-mask: var(--host-icon) center / contain no-repeat;
      mask: var(--host-icon) center / contain no-repeat;
    }

    .host-icon.claude {
      --host-icon: url("../assets/host-icons/claude.svg");
      color: #c4c2bc;
    }

    .host-icon.codex {
      --host-icon: url("../assets/host-icons/codex.svg");
      color: #48c97c;
    }

    .host.disconnected .host-icon { color: #aaa79f; }

    .event-actions {
      display: inline-flex;
      align-items: center;
      align-self: center;
      gap: 10px;
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      padding: 0;
      border: 0;
      border-radius: 10px;
      color: #c2bfb8;
      background: transparent;
      cursor: pointer;
    }

    .icon-button:hover { background: rgba(255, 255, 255, .06); }
    .icon-button.muted { color: var(--clay); }
    .icon-button svg { width: 29px; height: 29px; }
    .icon-button.muted svg { width: 34px; height: 34px; }

    .volume {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 27px;
      margin-top: 6px;
    }

    .volume label {
      font-size: 25px;
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      height: 8px;
      accent-color: var(--clay);
      cursor: pointer;
    }

    .pack-title { margin-top: 25px; }

    @media (max-width: 620px) {
      body { padding: 10px; }
      .panel { padding-inline: 20px; }
      .event-row { grid-template-columns: 44px minmax(0, 1fr) auto; column-gap: 9px; }
      .event-icon { width: 44px; height: 44px; }
      .chip { padding-inline: 8px; font-size: 16px; }
      .event-actions { gap: 2px; }
      .icon-button { width: 40px; }
    }
  </style>
</head>
<body>
  <main class="panel" aria-label="Claudio 事件行布局 mockup">
    <header class="topbar">
      <div class="wordmark" aria-label="claudi0">claudi<img src="../assets/branding/claudi0-mark.svg" alt="0"></div>
      <button class="language-button" type="button" aria-label="界面语言">Aa⌄</button>
    </header>

    <section class="panel-heading" aria-labelledby="pack-name">
      <h1 id="pack-name">皮卡丘</h1>
      <p class="audible-count">5 个可听事件</p>
    </section>

    <section class="host-grid" aria-label="主机连接状态">
      <article class="host-card">
        <div class="host-card-head">
          <span class="host-status pending" aria-hidden="true">◷</span>
          <h2 class="host-name">Claude Code</h2>
        </div>
        <p class="host-readiness">5/5 已配置</p>
        <p class="host-detail">请向 Claude Code 提交一次提示词以确认连接</p>
      </article>

      <article class="host-card">
        <div class="host-card-head">
          <span class="host-status ready" aria-hidden="true">✓</span>
          <h2 class="host-name">Codex</h2>
        </div>
        <p class="host-readiness">4/5 已就绪</p>
      </article>
    </section>

    <section aria-labelledby="events-title">
      <h2 class="section-title" id="events-title">皮卡丘 · 事件</h2>
      <div class="event-list" id="event-list"></div>
    </section>

    <section class="volume">
      <label for="master-volume">主音量</label>
      <input id="master-volume" type="range" min="0" max="100" value="74">
    </section>

    <h2 class="section-title pack-title">声音包</h2>
  </main>

  <script>
    const events = [
      { name: "任务开始", kind: "task", icon: "task", muted: false, claude: false, codex: true },
      { name: "本轮结束", kind: "complete", icon: "complete", muted: true, claude: false, codex: true },
      { name: "执行中断", kind: "interrupted", icon: "interrupted", muted: true, claude: false, codex: false },
      { name: "待响应", kind: "response", icon: "response", muted: true, claude: false, codex: true },
      { name: "子任务结束", kind: "subtask", icon: "subtask", muted: true, claude: false, codex: true }
    ];

    const eventIcons = {
      task: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m3 11 18-8-7 18-3-7-8-3Z" fill="currentColor"/><path d="m11 14 10-11" stroke="#d9eaff" stroke-width="1.2" opacity=".82"/></svg>',
      complete: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="currentColor"/><path d="m8 12 2.6 2.7L16.7 9" stroke="#122318" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      interrupted: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"/><rect x="8" y="7" width="3" height="10" rx="1" fill="#38280d"/><rect x="13" y="7" width="3" height="10" rx="1" fill="#38280d"/></svg>',
      response: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 17h12l-1.2-2.2v-4.6a4.8 4.8 0 0 0-9.6 0v4.6L6 17Z" fill="currentColor"/><path d="M10 19h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="17.5" cy="7" r="2.3" fill="currentColor"/></svg>',
      subtask: '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="m8 12 2.5 2.7L16.5 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    };

    const playIcon = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m7 4 13 8-13 8V4Z"/></svg>';
    const speakerIcon = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4V9Z" fill="currentColor"/><path d="M16 9.5c1.5 1.4 1.5 3.6 0 5M18.5 7c3 2.7 3 7.3 0 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
    const mutedIcon = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 9h4l5-4v6.2M12 16v3l-5-4H3V9" fill="currentColor"/><path d="m5 4 15 16M17 10c.8 1.1.8 2.4.2 3.5M19 7.5c2.1 2.4 2.3 5.7.8 8.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

    function hostChip(host, connected) {
      const label = host === "claude" ? "Claude" : "Codex";
      return `
        <span class="chip host ${connected ? "connected" : "disconnected"}">
          <span class="host-icon ${host}" aria-hidden="true"></span>
          ${label}
        </span>`;
    }

    function eventRow(event) {
      return `
        <article class="event-row">
          <span class="event-icon ${event.kind}" aria-hidden="true">${eventIcons[event.icon]}</span>
          <div class="row-copy">
            <h3 class="event-title">${event.name}</h3>
            <div class="chips" aria-label="${event.name}映射状态">
              ${hostChip("claude", event.claude)}
              ${hostChip("codex", event.codex)}
              <span class="chip coverage">已映射</span>
            </div>
          </div>
          <div class="event-actions">
            <button class="icon-button" type="button" aria-label="试听${event.name}">${playIcon}</button>
            <button class="icon-button ${event.muted ? "muted" : ""}" type="button" aria-label="${event.muted ? "取消静音" : "静音"}${event.name}">${event.muted ? mutedIcon : speakerIcon}</button>
          </div>
        </article>`;
    }

    document.querySelector("#event-list").innerHTML = events.map(eventRow).join("");
  </script>
</body>
</html>
