name: Feature request
description: Propose a focused product, host, sound-pack, accessibility, or developer-experience improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or repeated workflow should Claudio improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the behavior from the user's perspective, including failure and recovery states.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Menu bar panel
        - Claude Code integration
        - Codex integration
        - Sound packs and audio import
        - Accessibility and localization
        - CLI and diagnostics
        - Build, CI, or release
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What do users do today, and why is it insufficient?
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and data impact
      description: Note any effect on existing hooks, configuration, sound packs, receipts, backups, macOS versions, Intel, keyboard, or VoiceOver.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request does not include private host data, prompts, responses, or licensed personal audio.
          required: true
