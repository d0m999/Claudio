name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "RC version (strict MAJOR.MINOR.PATCH; first RC is 0.1.0)"
        required: true
        type: string
      target_commit:
        description: "Exact 40-character main commit SHA approved for this RC"
        required: true
        type: string
      release_authorized:
        description: "Confirm separate authorization to run the RC workflow was obtained"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: claudi0
  APP_EXECUTABLE: claudi0-app
  CASK_NAME: claudi0
  # Preserve the existing bundle identity so upgrades retain UserDefaults and window state.
  BUNDLE_ID: com.claudio.app
  DMG_SIGNING_IDENTIFIER: com.claudio.app.dmg
  MACOS_DEPLOYMENT_TARGET: "12.0"

jobs:
  build:
    name: Build, sign, notarize, and verify
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      dmg_name: ${{ steps.checksum.outputs.dmg_name }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate ref and derive version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_TARGET_COMMIT: ${{ inputs.target_commit }}
          DISPATCH_AUTHORIZED: ${{ inputs.release_authorized }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::RC dispatch must run from main"
              exit 1
            fi
            if ! [[ "$DISPATCH_AUTHORIZED" == "true" ]]; then
              echo "::error::RC dispatch requires separately obtained release authorization"
              exit 1
            fi
            if ! [[ "$DISPATCH_TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::target_commit must be an exact lowercase 40-character commit SHA"
              exit 1
            fi
            if ! [[ "$DISPATCH_TARGET_COMMIT" == "$GITHUB_SHA" ]]; then
              echo "::error::target_commit does not match the workflow trigger SHA"
              exit 1
            fi
            if ! [[ "$(git rev-parse HEAD)" == "$DISPATCH_TARGET_COMMIT" ]]; then
              echo "::error::checked out commit does not match target_commit"
              exit 1
            fi
            VERSION="$DISPATCH_VERSION"
            if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::RC version must match MAJOR.MINOR.PATCH exactly: $VERSION"
              exit 1
            fi
            if [[ "$VERSION" != "0.1.0" ]]; then
              echo "::error::the first release-candidate lane is fixed to 0.1.0"
              exit 1
            fi
            TAG=""
          else
            if [[ "$GITHUB_REF" != refs/tags/* ]]; then
              echo "::error::publish build must run from a tag ref"
              exit 1
            fi
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::release tag must match vMAJOR.MINOR.PATCH exactly: $TAG"
              exit 1
            fi
            VERSION="${TAG#v}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "CLAUDIO_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building $APP_NAME $VERSION"

      - name: Validate Apple credentials and create temporary keychain
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for variable_name in \
            CERTIFICATE_BASE64 \
            CERTIFICATE_PASSWORD \
            NOTARY_API_KEY_BASE64 \
            NOTARY_KEY_ID \
            NOTARY_ISSUER_ID \
            EXPECTED_TEAM_ID; do
            if [[ -z "${!variable_name:-}" ]]; then
              missing+=("$variable_name")
            fi
          done
          if [[ ${#missing[@]} -ne 0 ]]; then
            echo "::error::missing required Apple release credentials: ${missing[*]}"
            exit 1
          fi
          if [[ ! "$EXPECTED_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_DEVELOPER_TEAM_ID must be a 10-character Apple team ID"
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/claudio-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/claudio-developer-id.p12"
          NOTARY_KEY_PATH="$RUNNER_TEMP/claudio-notary-api-key.p8"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$NOTARY_API_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod 600 "$CERTIFICATE_PATH" "$NOTARY_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p')"
          IDENTITY_COUNT="$(printf '%s\n' "$IDENTITIES" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$IDENTITY_COUNT" != "1" ]]; then
            echo "::error::expected exactly one Developer ID Application identity; found $IDENTITY_COUNT"
            exit 1
          fi
          SIGNING_IDENTITY="$(printf '%s\n' "$IDENTITIES" | sed -n '1p')"
          echo "::add-mask::$SIGNING_IDENTITY"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_CERTIFICATE_PATH=$CERTIFICATE_PATH" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"
          echo "EXPECTED_TEAM_ID=$EXPECTED_TEAM_ID" >> "$GITHUB_ENV"

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          SWIFT_VERSION="$(swift --version)"
          printf '%s\n' "$SWIFT_VERSION"
          if [[ ! "$SWIFT_VERSION" =~ Apple\ Swift\ version\ 6\. ]]; then
            echo "::error::Swift 6 is required; selected toolchain reported: $SWIFT_VERSION"
            exit 1
          fi

      - name: Run complete helper, GUI, and localization contracts
        shell: bash
        run: |
          set -euo pipefail
          swift run --package-path helper claudio-tests
          swift run --package-path gui claudio-gui-tests
          bash scripts/test-hook-cli-contract.sh
          bash scripts/test-legacy-install-cli-contract.sh
          jq empty gui/Sources/ClaudioLocalization/Resources/Localizable.xcstrings

      - name: Build helper (arm64)
        working-directory: helper
        run: swift build -c release --arch arm64 --product claudio

      - name: Build helper (x86_64)
        working-directory: helper
        run: swift build -c release --arch x86_64 --product claudio

      - name: Merge universal helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          lipo -create \
            helper/.build/arm64-apple-macosx/release/claudio \
            helper/.build/x86_64-apple-macosx/release/claudio \
            -output dist/bin/claudio
          strip -x dist/bin/claudio
          chmod +x dist/bin/claudio

      - name: Build GUI (arm64)
        working-directory: gui
        run: swift build -c release --arch arm64 --product ClaudioGUI -Xswiftc -Osize

      - name: Build GUI (x86_64)
        working-directory: gui
        run: swift build -c release --arch x86_64 --product ClaudioGUI -Xswiftc -Osize

      - name: Build LoginItem (arm64)
        working-directory: gui
        run: swift build -c release --arch arm64 --product ClaudioLoginItem

      - name: Build LoginItem (x86_64)
        working-directory: gui
        run: swift build -c release --arch x86_64 --product ClaudioLoginItem

      - name: Merge universal GUI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/app-bin
          lipo -create \
            gui/.build/arm64-apple-macosx/release/ClaudioGUI \
            gui/.build/x86_64-apple-macosx/release/ClaudioGUI \
            -output dist/app-bin/ClaudioGUI
          strip -x dist/app-bin/ClaudioGUI
          chmod +x dist/app-bin/ClaudioGUI

      - name: Merge universal LoginItem
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/app-bin
          lipo -create \
            gui/.build/arm64-apple-macosx/release/ClaudioLoginItem \
            gui/.build/x86_64-apple-macosx/release/ClaudioLoginItem \
            -output dist/app-bin/ClaudioLoginItem
          strip -x dist/app-bin/ClaudioLoginItem
          chmod +x dist/app-bin/ClaudioLoginItem

      - name: Assemble app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/$APP_NAME.app"
          if [[ -e "$APP" ]]; then
            echo "::error::unexpected pre-existing app bundle: $APP"
            exit 1
          fi
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/bin" "$APP/Contents/Resources/packs"
          cp dist/app-bin/ClaudioGUI "$APP/Contents/MacOS/$APP_EXECUTABLE"

          find_unique_gui_resource_bundle() {
            local search_dir="$1"
            local -a candidates=()
            shopt -s nullglob
            candidates=("$search_dir"/*_ClaudioGUI.bundle)
            shopt -u nullglob
            if [[ ${#candidates[@]} -ne 1 || ! -d "${candidates[0]:-}" ]]; then
              echo "::error::expected exactly one *_ClaudioGUI.bundle in $search_dir; found ${#candidates[@]}"
              return 1
            fi
            printf '%s\n' "${candidates[0]}"
          }

          find_unique_localization_bundle() {
            local search_dir="$1"
            local -a candidates=()
            shopt -s nullglob
            candidates=("$search_dir"/*_ClaudioLocalization.bundle)
            shopt -u nullglob
            if [[ ${#candidates[@]} -ne 1 || ! -d "${candidates[0]:-}" ]]; then
              echo "::error::expected exactly one *_ClaudioLocalization.bundle in $search_dir; found ${#candidates[@]}"
              return 1
            fi
            printf '%s\n' "${candidates[0]}"
          }

          ARM_GUI_RESOURCE_BUNDLE="$(find_unique_gui_resource_bundle \
            gui/.build/arm64-apple-macosx/release)"
          X86_GUI_RESOURCE_BUNDLE="$(find_unique_gui_resource_bundle \
            gui/.build/x86_64-apple-macosx/release)"
          if ! diff -qr "$ARM_GUI_RESOURCE_BUNDLE" "$X86_GUI_RESOURCE_BUNDLE"; then
            echo "::error::arm64 and x86_64 ClaudioGUI resource bundles differ"
            exit 1
          fi
          cp -R "$ARM_GUI_RESOURCE_BUNDLE" \
            "$APP/Contents/Resources/$(basename "$ARM_GUI_RESOURCE_BUNDLE")"

          ARM_LOCALIZATION_BUNDLE="$(find_unique_localization_bundle \
            gui/.build/arm64-apple-macosx/release)"
          X86_LOCALIZATION_BUNDLE="$(find_unique_localization_bundle \
            gui/.build/x86_64-apple-macosx/release)"
          if ! diff -qr "$ARM_LOCALIZATION_BUNDLE" "$X86_LOCALIZATION_BUNDLE"; then
            echo "::error::arm64 and x86_64 ClaudioLocalization resource bundles differ"
            exit 1
          fi
          cp -R "$ARM_LOCALIZATION_BUNDLE" \
            "$APP/Contents/Resources/$(basename "$ARM_LOCALIZATION_BUNDLE")"
          cp -R gui/AppResources/en.lproj "$APP/Contents/Resources/en.lproj"
          cp -R gui/AppResources/zh-Hans.lproj "$APP/Contents/Resources/zh-Hans.lproj"

          cp dist/bin/claudio "$APP/Contents/Resources/bin/claudi0"
          ln -s claudi0 "$APP/Contents/Resources/bin/claudio"
          bash scripts/copy-bundled-packs.sh packs "$APP/Contents/Resources/packs"
          cp assets/branding/claudi0.icns "$APP/Contents/Resources/claudi0.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>$APP_NAME</string>
            <key>CFBundleDisplayName</key><string>$APP_NAME</string>
            <key>CFBundleIdentifier</key><string>$BUNDLE_ID</string>
            <key>CFBundleVersion</key><string>$CLAUDIO_VERSION</string>
            <key>CFBundleShortVersionString</key><string>$CLAUDIO_VERSION</string>
            <key>CFBundleExecutable</key><string>$APP_EXECUTABLE</string>
            <key>CFBundleIconFile</key><string>claudi0.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>$MACOS_DEPLOYMENT_TARGET</string>
            <key>NSFocusStatusUsageDescription</key><string>claudi0 uses only whether Focus is active to temporarily quiet automatic sounds. It never stores the Focus name.</string>
            <key>NSCalendarsUsageDescription</key><string>claudi0 checks only whether a non-all-day busy event is active to temporarily quiet automatic sounds. It never stores event details.</string>
            <key>NSCalendarsFullAccessUsageDescription</key><string>claudi0 checks only whether a non-all-day busy event is active to temporarily quiet automatic sounds. It never stores event details.</string>
            <key>LSUIElement</key><true/>
          </dict>
          </plist>
          PLIST
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          bash scripts/assemble-login-item.sh \
            dist/app-bin/ClaudioLoginItem "$APP" "$CLAUDIO_VERSION"

      - name: Verify unified version and release size budget
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/$APP_NAME.app"
          CLI_VERSION="$("$APP/Contents/Resources/bin/claudi0" --version)"
          SHORT_VERSION="$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")"
          BUNDLE_VERSION="$(plutil -extract CFBundleVersion raw "$APP/Contents/Info.plist")"
          LOGIN_ITEM_PLIST="$APP/Contents/Library/LoginItems/claudi0 LoginItem.app/Contents/Info.plist"
          LOGIN_ITEM_SHORT_VERSION="$(plutil -extract CFBundleShortVersionString raw \
            "$LOGIN_ITEM_PLIST")"
          LOGIN_ITEM_BUNDLE_VERSION="$(plutil -extract CFBundleVersion raw \
            "$LOGIN_ITEM_PLIST")"
          for ACTUAL_VERSION in \
            "$CLI_VERSION" \
            "$SHORT_VERSION" \
            "$BUNDLE_VERSION" \
            "$LOGIN_ITEM_SHORT_VERSION" \
            "$LOGIN_ITEM_BUNDLE_VERSION"; do
            if [[ "$ACTUAL_VERSION" != "$CLAUDIO_VERSION" ]]; then
              echo "::error::release version mismatch: expected=$CLAUDIO_VERSION actual=$ACTUAL_VERSION"
              exit 1
            fi
          done
          bash scripts/check-release-size.sh "$APP"

      - name: Verify universal binaries
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/$APP_NAME.app"
          for BINARY in \
            "$APP/Contents/MacOS/$APP_EXECUTABLE" \
            "$APP/Contents/Resources/bin/claudi0" \
            "$APP/Contents/Resources/bin/claudio" \
            "$APP/Contents/Library/LoginItems/claudi0 LoginItem.app/Contents/MacOS/claudi0-login-item"; do
            ARCHS="$(lipo -archs "$BINARY")"
            echo "$BINARY architectures: $ARCHS"
            if [[ " $ARCHS " != *" arm64 "* || " $ARCHS " != *" x86_64 "* ]]; then
              echo "::error::$BINARY is not an arm64+x86_64 universal binary"
              exit 1
            fi
          done

      - name: Sign app with Developer ID and hardened runtime
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/$APP_NAME.app"
          LOGIN_ITEM_APP="$APP/Contents/Library/LoginItems/claudi0 LoginItem.app"
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$SIGNING_IDENTITY" \
            "$APP/Contents/Resources/bin/claudi0"
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$SIGNING_IDENTITY" \
            "$LOGIN_ITEM_APP"
          codesign \
            --force \
            --options runtime \
            --timestamp \
            --entitlements gui/ClaudioGUI.entitlements \
            --sign "$SIGNING_IDENTITY" \
            "$APP"
          bash scripts/verify-release-signature.sh \
            executable "$EXPECTED_TEAM_ID" "$APP/Contents/Resources/bin/claudi0"
          bash scripts/verify-release-signature.sh app "$EXPECTED_TEAM_ID" "$LOGIN_ITEM_APP"
          bash scripts/verify-release-signature.sh app "$EXPECTED_TEAM_ID" "$APP"

      - name: Notarize and staple app
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/notarize-release-artifact.sh "dist/$APP_NAME.app"

      - name: Build and sign DMG
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/$APP_NAME.app"
          DMG_NAME="$APP_NAME-$CLAUDIO_VERSION.dmg"
          DMG_PATH="dist/$DMG_NAME"
          STAGE="$(mktemp -d "$RUNNER_TEMP/claudio-dmg-stage.XXXXXX")"
          cleanup_stage() {
            rm -rf "$STAGE"
          }
          trap cleanup_stage EXIT
          ditto "$APP" "$STAGE/$APP_NAME.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            "$DMG_PATH"
          codesign \
            --force \
            --timestamp \
            --identifier "$DMG_SIGNING_IDENTIFIER" \
            --sign "$SIGNING_IDENTITY" \
            "$DMG_PATH"
          bash scripts/verify-release-signature.sh dmg "$EXPECTED_TEAM_ID" "$DMG_PATH"
          hdiutil verify "$DMG_PATH"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Notarize, staple, and assess DMG
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/notarize-release-artifact.sh "dist/$DMG_NAME"

      - name: Generate and verify checksums
        id: checksum
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="dist/$DMG_NAME"
          SHA256="$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA256" "$DMG_NAME" > dist/SHA256SUMS.txt
          (
            cd dist
            shasum -a 256 -c SHA256SUMS.txt
          )
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Write commit-bound RC manifest
        if: github.event_name == 'workflow_dispatch'
        env:
          RC_VERSION: ${{ steps.version.outputs.version }}
          RC_DMG_NAME: ${{ steps.checksum.outputs.dmg_name }}
          RC_DMG_SHA256: ${{ steps.checksum.outputs.sha256 }}
          RC_TARGET_COMMIT: ${{ inputs.target_commit }}
          RC_AUTHORIZATION_ATTESTED: ${{ inputs.release_authorized }}
          RC_WORKFLOW_PATH: .github/workflows/release.yml
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RC_TARGET_COMMIT" != "$GITHUB_SHA" \
            || "$RC_AUTHORIZATION_ATTESTED" != "true" \
            || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::RC manifest identity no longer matches the validated dispatch inputs"
            exit 1
          fi
          ARTIFACT_NAME="claudi0-rc-$GITHUB_SHA"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n \
            --arg workflow_name "$GITHUB_WORKFLOW" \
            --arg workflow_path "$RC_WORKFLOW_PATH" \
            --arg workflow_event "$GITHUB_EVENT_NAME" \
            --arg workflow_ref "$GITHUB_REF" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg workflow_run_url "$RUN_URL" \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg target_commit "$RC_TARGET_COMMIT" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg version "$RC_VERSION" \
            --arg dmg_name "$RC_DMG_NAME" \
            --arg dmg_sha256 "$RC_DMG_SHA256" \
            --argjson authorization_attested "$RC_AUTHORIZATION_ATTESTED" '
              {
                schema: 2,
                workflow_name: $workflow_name,
                workflow_path: $workflow_path,
                workflow_event: $workflow_event,
                workflow_ref: $workflow_ref,
                workflow_run_id: $workflow_run_id,
                workflow_run_url: $workflow_run_url,
                artifact_name: $artifact_name,
                target_commit: $target_commit,
                commit_sha: $commit_sha,
                version: $version,
                dmg_name: $dmg_name,
                dmg_sha256: $dmg_sha256,
                authorization_attested: $authorization_attested
              }
            ' > dist/RC_MANIFEST.json
          jq empty dist/RC_MANIFEST.json

      - name: Mount final DMG and verify shipped bytes
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="dist/$DMG_NAME"
          MOUNT_DIR="$(mktemp -d "$RUNNER_TEMP/claudio-dmg-mount.XXXXXX")"
          cleanup_mount() {
            hdiutil detach "$MOUNT_DIR" >/dev/null 2>&1 || true
            rmdir "$MOUNT_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup_mount EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT_DIR" "$DMG_PATH"
          APP="$MOUNT_DIR/$APP_NAME.app"
          test -d "$APP"
          diff -qr "dist/$APP_NAME.app" "$APP"
          test -d "$APP/Contents/Resources/packs/minimal-chime"
          LOGIN_ITEM_APP="$APP/Contents/Library/LoginItems/claudi0 LoginItem.app"
          LOGIN_ITEM_PLIST="$LOGIN_ITEM_APP/Contents/Info.plist"
          test -d "$LOGIN_ITEM_APP"
          test "$(readlink "$APP/Contents/Resources/bin/claudio")" = "claudi0"
          CLI_VERSION="$("$APP/Contents/Resources/bin/claudi0" --version)"
          SHORT_VERSION="$(plutil -extract CFBundleShortVersionString raw \
            "$APP/Contents/Info.plist")"
          BUNDLE_VERSION="$(plutil -extract CFBundleVersion raw "$APP/Contents/Info.plist")"
          LOGIN_ITEM_SHORT_VERSION="$(plutil -extract CFBundleShortVersionString raw \
            "$LOGIN_ITEM_PLIST")"
          LOGIN_ITEM_BUNDLE_VERSION="$(plutil -extract CFBundleVersion raw \
            "$LOGIN_ITEM_PLIST")"
          for ACTUAL_VERSION in \
            "$CLI_VERSION" \
            "$SHORT_VERSION" \
            "$BUNDLE_VERSION" \
            "$LOGIN_ITEM_SHORT_VERSION" \
            "$LOGIN_ITEM_BUNDLE_VERSION"; do
            if [[ "$ACTUAL_VERSION" != "$CLAUDIO_VERSION" ]]; then
              echo "::error::final DMG version mismatch: expected=$CLAUDIO_VERSION actual=$ACTUAL_VERSION"
              exit 1
            fi
          done
          for BINARY in \
            "$APP/Contents/MacOS/$APP_EXECUTABLE" \
            "$APP/Contents/Resources/bin/claudi0" \
            "$LOGIN_ITEM_APP/Contents/MacOS/claudi0-login-item"; do
            ARCHS="$(lipo -archs "$BINARY")"
            [[ " $ARCHS " == *" arm64 "* && " $ARCHS " == *" x86_64 "* ]]
            bash scripts/verify-release-signature.sh executable "$EXPECTED_TEAM_ID" "$BINARY"
          done
          bash scripts/check-release-size.sh "$APP"
          bash scripts/verify-release-signature.sh app "$EXPECTED_TEAM_ID" "$LOGIN_ITEM_APP"
          bash scripts/verify-release-signature.sh app "$EXPECTED_TEAM_ID" "$APP"
          bash scripts/verify-release-signature.sh dmg "$EXPECTED_TEAM_ID" "$DMG_PATH"
          spctl --assess --type execute --verbose=4 "$APP"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "$DMG_PATH"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG_PATH"
          (cd dist && shasum -a 256 -c SHA256SUMS.txt)

      - name: Upload commit-bound release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: claudi0-${{ github.event_name == 'workflow_dispatch' && 'rc' || 'tag' }}-${{ github.sha }}
          path: |
            dist/${{ steps.checksum.outputs.dmg_name }}
            dist/SHA256SUMS.txt
            dist/RC_MANIFEST.json
          if-no-files-found: error
          retention-days: 30

      - name: Clean temporary signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="${SIGNING_KEYCHAIN_PATH:-$RUNNER_TEMP/claudio-signing.keychain-db}"
          CERTIFICATE_PATH="${SIGNING_CERTIFICATE_PATH:-$RUNNER_TEMP/claudio-developer-id.p12}"
          API_KEY_PATH="${NOTARY_KEY_PATH:-$RUNNER_TEMP/claudio-notary-api-key.p8}"
          if [[ -e "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$CERTIFICATE_PATH" "$API_KEY_PATH"

  publish:
    name: Publish tag-only GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Download the verified tag artifact
        uses: actions/download-artifact@v4
        with:
          name: claudi0-tag-${{ github.sha }}
          path: release-dist

      - name: Reverify artifact and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          CLAUDIO_VERSION: ${{ needs.build.outputs.version }}
          DMG_NAME: ${{ needs.build.outputs.dmg_name }}
          EXPECTED_SHA: ${{ needs.build.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-dist
          shasum -a 256 -c SHA256SUMS.txt
          ACTUAL_SHA="$(shasum -a 256 "$DMG_NAME" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          gh release create "$RELEASE_TAG" \
            "$DMG_NAME" \
            SHA256SUMS.txt \
            --verify-tag \
            --title "$APP_NAME $CLAUDIO_VERSION" \
            --generate-notes

  update-cask:
    name: Update optional Homebrew tap
    if: startsWith(github.ref, 'refs/tags/') && vars.HOMEBREW_TAP_ENABLED == 'true'
    needs: [build, publish]
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Validate Homebrew token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::error::HOMEBREW_TAP_ENABLED is true but HOMEBREW_TAP_TOKEN is missing"
            exit 1
          fi

      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: d0m999/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          ref: main
          path: homebrew-tap

      - name: Write and push cask
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::invalid cask version: $VERSION"
            exit 1
          fi
          if [[ ! "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::invalid cask SHA-256"
            exit 1
          fi

          mkdir -p homebrew-tap/Casks
          cat > "homebrew-tap/Casks/$CASK_NAME.rb" <<CASK
          cask "$CASK_NAME" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/d0m999/Claudio/releases/download/v#{version}/$APP_NAME-#{version}.dmg"
            name "$APP_NAME"
            desc "Semantic sound cues for Claude Code and Codex"
            homepage "https://github.com/d0m999/Claudio"

            depends_on macos: ">= :monterey"

            app "$APP_NAME.app"

            caveats <<~EOS
              Open $APP_NAME and connect Claude Code and Codex from the menu bar panel.
              Uninstalling the cask intentionally preserves ~/.claudio and host configuration;
              disconnect hosts first if you want to remove Claudio's hook entries.
            EOS
          end
          CASK

          cd homebrew-tap
          if [[ -z "$(git status --porcelain -- "Casks/$CASK_NAME.rb")" ]]; then
            echo "Cask is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/$CASK_NAME.rb"
          git commit -m "Update $CASK_NAME cask to $VERSION"
          git push origin HEAD:refs/heads/main
