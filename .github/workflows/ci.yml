name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helper:
    name: Helper
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      NSUnbufferedIO: YES
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          SWIFT_VERSION="$(swift --version)"
          printf '%s\n' "$SWIFT_VERSION"
          if [[ ! "$SWIFT_VERSION" =~ Apple\ Swift\ version\ 6\. ]]; then
            echo "::error::Swift 6 is required; selected toolchain reported: $SWIFT_VERSION"
            exit 1
          fi
          FINGERPRINT="$( { swift --version; xcodebuild -version; } | shasum -a 256 | awk '{ print $1 }' )"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM build cache
        uses: actions/cache@v5
        with:
          path: helper/.build
          key: helper-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('helper/Package.resolved', 'helper/Package.swift') }}-v1

      - name: Check patch whitespace
        shell: bash
        env:
          CLAUDIO_CI_EVENT_NAME: ${{ github.event_name }}
          CLAUDIO_CI_PUSH_BEFORE: ${{ github.event.before }}
          CLAUDIO_CI_PUSH_HEAD: ${{ github.sha }}
          CLAUDIO_CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CLAUDIO_CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$CLAUDIO_CI_EVENT_NAME" == "pull_request" ]]; then
            base="$CLAUDIO_CI_PR_BASE"
            head="$CLAUDIO_CI_PR_HEAD"
          else
            base="$CLAUDIO_CI_PUSH_BEFORE"
            head="$CLAUDIO_CI_PUSH_HEAD"
          fi

          if [[ -z "$base" || -z "$head" ]]; then
            echo "::error::unable to determine the revision range for whitespace validation"
            exit 1
          fi

          if [[ "$base" =~ ^0+$ ]]; then
            git diff-tree --check --root -r "$head"
          else
            git diff --check "$base" "$head"
          fi

      - name: Verify development version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(swift run --package-path helper claudio --version)"
          if [[ "$VERSION" != "0.0.0-dev" ]]; then
            echo "::error::development CLI version must be 0.0.0-dev; got $VERSION"
            exit 1
          fi

      - name: Run helper harness
        run: swift run --package-path helper claudio-tests

  gui:
    name: GUI and bundle
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      NSUnbufferedIO: YES
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          SWIFT_VERSION="$(swift --version)"
          printf '%s\n' "$SWIFT_VERSION"
          if [[ ! "$SWIFT_VERSION" =~ Apple\ Swift\ version\ 6\. ]]; then
            echo "::error::Swift 6 is required; selected toolchain reported: $SWIFT_VERSION"
            exit 1
          fi
          FINGERPRINT="$( { swift --version; xcodebuild -version; } | shasum -a 256 | awk '{ print $1 }' )"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM build cache
        id: swiftpm-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            gui/.build
            helper/.build
          key: gui-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('helper/Package.resolved', 'helper/Package.swift', 'gui/Package.swift') }}-v1

      - name: Validate string catalog JSON
        run: jq empty gui/Sources/ClaudioLocalization/Resources/Localizable.xcstrings

      - name: Diagnose event-attention harness
        shell: bash
        env:
          CLAUDIO_HANG_DIAGNOSTICS: "1"
        run: |
          set -u
          swift run --package-path gui claudio-gui-tests --event-attention &
          HARNESS_PID=$!
          (
            sleep 240 &
            TIMER_PID=$!
            trap 'kill "$TIMER_PID" 2>/dev/null || true; exit 0' TERM INT
            wait "$TIMER_PID"
            trap - TERM INT
            if kill -0 "$HARNESS_PID" 2>/dev/null; then
              echo "::error::event-attention harness exceeded 240 seconds; sampling pid $HARNESS_PID"
              /usr/bin/sample "$HARNESS_PID" 5 10 || true
              kill -ABRT "$HARNESS_PID" 2>/dev/null || true
            fi
          ) &
          WATCHDOG_PID=$!
          set +e
          wait "$HARNESS_PID"
          STATUS=$?
          set -e
          kill "$WATCHDOG_PID" 2>/dev/null || true
          wait "$WATCHDOG_PID" 2>/dev/null || true
          exit "$STATUS"

      - name: Run GUI harness
        run: swift run --package-path gui claudio-gui-tests

      - name: Build ClaudioGUI (Debug)
        run: swift build -c debug --package-path gui --product ClaudioGUI

      - name: Build ClaudioGUI (Release)
        run: swift build -c release --package-path gui --product ClaudioGUI -Xswiftc -Osize

      - name: Save SwiftPM build cache
        if: steps.swiftpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            gui/.build
            helper/.build
          key: gui-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('helper/Package.resolved', 'helper/Package.swift', 'gui/Package.swift') }}-v1

      - name: Assemble local release-layout app
        run: bash scripts/dev-bundle.sh

      - name: Verify release size budget
        run: bash scripts/check-release-size.sh dist/claudi0.app

  verify:
    name: Test and build
    if: ${{ !cancelled() }}
    needs: [helper, gui]
    runs-on: ubuntu-latest
    steps:
      - name: Require both lanes
        env:
          HELPER_RESULT: ${{ needs.helper.result }}
          GUI_RESULT: ${{ needs.gui.result }}
        run: |
          test "$HELPER_RESULT" = success
          test "$GUI_RESULT" = success
